<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅占卜：過去 現在 未來</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
            --text-gray: #a0a0a0;
        }

        body {
            font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 90%;
            max-width: 1100px;
            padding: 40px 0;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.3em;
            color: var(--gold);
            font-weight: 300;
            margin-bottom: 50px;
            text-transform: uppercase;
        }

        /* RWD 佈局：手機垂直，電腦水平 */
        .tarot-spread {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .tarot-spread {
                flex-direction: row;
                justify-content: space-around;
                align-items: flex-start;
            }
        }

        /* 卡片外框時尚風格 */
        .card-item {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            width: 260px;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-item:hover {
            transform: translateY(-15px);
            border-color: var(--gold);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
        }

        /* 標籤設計 (過去/現在/未來) */
        .time-label {
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 0.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            filter: grayscale(20%);
            transition: 0.5s;
        }

        .card-item:hover img {
            filter: grayscale(0%);
        }

        .card-number {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-gray);
            font-family: 'Georgia', serif;
        }

        /* 錯誤提示區 */
        .error-msg {
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 10px;
            border: 1px dashed #444;
            line-height: 2;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 id="page-title">您的塔羅過去現在未來</h1>
        
        <div class="tarot-spread" id="spread-container">
            </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const container = document.getElementById('spread-container');
        
        // 定義對應關係
        const timeFlow = [
            { key: 'c1', label: '過 去 · PAST' },
            { key: 'c2', label: '現 在 · PRESENT' },
            { key: 'c3', label: '未 來 · FUTURE' }
        ];

        let contentHTML = '';
        let hasValidData = true;

        timeFlow.forEach(item => {
            const val = params.get(item.key);
            if (val !== null) {
                const imgNum = val.toString().padStart(2, '0');
                contentHTML += `
                    <div class="card-item">
                        <div class="time-label">${item.label}</div>
                        <img src="tarot_${imgNum}.jpg" alt="${item.label}">
                        <div class="card-number">NO. ${imgNum}</div>
                    </div>
                `;
            } else {
                hasValidData = false;
            }
        });

        if (hasValidData) {
            container.innerHTML = contentHTML;
        } else {
            document.getElementById('page-title').innerText = "占卜引導";
            container.innerHTML = `
                <div class="error-msg">
                    <p>請確認網址包含三張牌的參數，例如：</p>
                    <code style="color:var(--gold)">?c1=08&c2=19&c3=77</code>
                </div>
            `;
        }
    </script>
</body>
</html>
