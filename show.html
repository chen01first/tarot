<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位塔羅顧問 - 命運翻轉</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #0f0f1a;
            --text-light: #e0e0e0;
            --accent-purple: #2d1b4e;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'PingFang TC', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* 為 3D 翻轉提供透視感 */
        }

        .container { width: 90%; max-width: 1000px; text-align: center; }

        /* 呼呼吸引導與文字 (同前，略縮) */
        .breath-guide { width: 100px; height: 100px; background: radial-gradient(circle, #6a1b9a, transparent); border-radius: 50%; margin: 20px auto; animation: breath 6s infinite; border: 1px solid var(--primary-gold); }
        @keyframes breath { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.7; } }

        .screen { display: none; animation: fadeIn 0.8s forwards; }
        .screen.active { display: block; }

        /* --- 核心：翻牌動畫設計 --- */
        #deck-area {
            position: relative;
            height: 300px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 牌卡容器 */
        .tarot-card {
            width: 160px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* 正反面共同樣式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #222;
        }

        /* 背面 (點擊前) */
        .card-back {
            background: linear-gradient(135deg, #1a1a2e 0%, #4a148c 100%);
            z-index: 2;
        }
        .card-back::after {
            content: "✦";
            font-size: 3rem;
            color: var(--primary-gold);
        }

        /* 正面 (翻開後) */
        .card-front {
            transform: rotateY(180deg);
            z-index: 1;
            overflow: hidden;
        }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }

        /* 翻牌 + 放大的 Class */
        .is-flipped {
            transform: rotateY(180deg) scale(1.5);
            z-index: 100;
        }

        /* 結果展示 */
        .result-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .final-card {
            width: 120px;
            animation: popIn 0.5s ease-out forwards;
        }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn { background: transparent; border: 2px solid var(--primary-gold); color: var(--primary-gold); padding: 12px 30px; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .btn:hover { background: var(--primary-gold); color: var(--bg-dark); box-shadow: 0 0 20px var(--primary-gold); }
        #copy-toast { visibility: hidden; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary-gold); color: #000; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-intro" class="screen active">
            <h1>數位塔羅顧問</h1>
            <div class="breath-guide"></div>
            <p>請找一個安靜的空間坐好，深呼吸三次。<br>在心中默想你的問題...</p>
            <button class="btn" onclick="nextScreen('screen-draw')">準備好了，開始抽牌</button>
        </div>

        <div id="screen-draw" class="screen">
            <h2 id="draw-hint">請感受能量，點擊卡牌</h2>
            <div id="deck-area">
                <div class="tarot-card" id="main-card" onclick="processDraw()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img src="" id="front-img">
                    </div>
                </div>
            </div>
            <div id="mini-history" style="display:flex; justify-content:center; gap:10px; height: 50px;">
                </div>
        </div>

        <div id="screen-result" class="screen">
            <h1>命運的啟示</h1>
            <div class="result-grid" id="result-display"></div>
            <button class="btn" onclick="copyResults()">一鍵複製結果 (貼回 AI 分析)</button>
            <p><small onclick="location.reload()" style="cursor:pointer; opacity:0.5;">重新連結能量</small></p>
        </div>
    </div>

    <div id="copy-toast">牌名已複製！</div>

    <script>
        const tarotData = {
            "00": "愚者", "01": "魔術師", "02": "女祭司", "03": "皇后", "04": "皇帝", "05": "教皇", "06": "戀人", "07": "戰車", "08": "力量", "09": "隱者", "10": "命運之輪", "11": "正義", "12": "倒吊人", "13": "死神", "14": "節制", "15": "惡魔", "16": "塔", "17": "星星", "18": "月亮", "19": "太陽", "20": "審判", "21": "世界",
            "22": "權杖王牌", "23": "權杖二", "24": "權杖三", "25": "權杖四", "26": "權杖五", "27": "權杖六", "28": "權杖七", "29": "權杖八", "30": "權杖九", "31": "權杖十", "32": "權杖侍者", "33": "權杖騎士", "34": "權杖王后", "35": "權杖國王",
            "36": "聖杯王牌", "37": "聖杯二", "38": "聖杯三", "39": "聖杯四", "40": "聖杯五", "41": "聖杯六", "42": "聖杯七", "43": "聖杯八", "44": "聖杯九", "45": "聖杯十", "46": "聖杯侍者", "47": "聖杯騎士", "48": "聖杯王后", "49": "聖杯國王",
            "50": "寶劍王牌", "51": "寶劍二", "52": "寶劍三", "53": "寶劍四", "54": "寶劍五", "55": "寶劍六", "56": "寶劍七", "57": "寶劍八", "58": "寶劍九", "59": "寶劍十", "60": "寶劍侍者", "61": "寶劍騎士", "62": "寶劍王后", "63": "寶劍國王",
            "64": "錢幣王牌", "65": "錢幣二", "66": "錢幣三", "67": "錢幣四", "68": "錢幣五", "69": "錢幣六", "70": "錢幣七", "71": "錢幣八", "72": "錢幣九", "73": "錢幣十", "74": "錢幣侍者", "75": "錢幣騎士", "76": "錢幣王后", "77": "錢幣國王"
        };

        let pickedIndices = [];
        let isAnimating = false;

        function nextScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function processDraw() {
            if (isAnimating || pickedIndices.length >= 3) return;
            isAnimating = true;

            // 1. 隨機取號
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * 78).toString().padStart(2, '0');
            } while (pickedIndices.includes(randomIndex));

            // 2. 準備正面圖片
            const frontImg = document.getElementById('front-img');
            frontImg.src = `tarot_${randomIndex}.jpg`;
            // 備用圖片路徑 (測試用)
            frontImg.onerror = () => { frontImg.src = `https://via.placeholder.com/200x350/2d1b4e/d4af37?text=${tarotData[randomIndex]}`; };

            // 3. 觸發動畫 (翻轉+放大)
            const card = document.getElementById('main-card');
            card.classList.add('is-flipped');

            // 4. 動畫完成後的處理
            setTimeout(() => {
                pickedIndices.push(randomIndex);
                
                // 記錄到下方小圖 (表示進度)
                const mini = document.getElementById('mini-history');
                mini.innerHTML += `<div style="width:30px; height:50px; border:1px solid gold; background:#333; border-radius:4px;"></div>`;

                // 恢復原狀以便下次抽取
                card.classList.remove('is-flipped');
                
                setTimeout(() => {
                    isAnimating = false;
                    if (pickedIndices.length === 3) {
                        renderFinalResults();
                    } else {
                        document.getElementById('draw-hint').innerText = `已連結第 ${pickedIndices.length} 張牌，請抽下一張`;
                    }
                }, 400); // 等待縮回原位的時間

            }, 1800); // 牌在空中停留觀察的時間
        }

        function renderFinalResults() {
            nextScreen('screen-result');
            const display = document.getElementById('result-display');
            display.innerHTML = '';
            
            pickedIndices.forEach(idx => {
                display.innerHTML += `
                    <div class="final-card">
                        <img src="tarot_${idx}.jpg" style="width:100%; border-radius:8px; border:1px solid var(--primary-gold);" 
                             onerror="this.src='https://via.placeholder.com/200x350/222/d4af37?text=${tarotData[idx]}'">
                        <p style="color:var(--primary-gold); font-weight:bold;">${tarotData[idx]}</p>
                    </div>
                `;
            });
        }

        function copyResults() {
            const names = pickedIndices.map(idx => tarotData[idx]).join('、');
            const text = `我抽到了三張塔羅牌：【${names}】。請根據這三張牌的含義，為我目前的狀況提供深入的分析與建議。`;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.visibility = 'visible';
                setTimeout(() => toast.style.visibility = 'hidden', 2000);
            });
        }
    </script>
</body>
</html>
