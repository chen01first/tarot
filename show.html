<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位塔羅顧問 - 深度連結版</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #0a0a12;
            --text-light: #e0e0e0;
            --accent-purple: #311b92;
            --glow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1200px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
            z-index: 1;
        }

        /* --- 畫面切換控制 --- */
        .screen {
            display: none;
            animation: fadeIn 1s ease-in-out forwards;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 引導階段：深呼吸動畫 --- */
        .breath-guide {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            border-radius: 50%;
            margin: 40px auto;
            border: 2px solid var(--primary-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-gold);
            animation: breathAction 8s infinite ease-in-out;
            box-shadow: var(--glow);
        }

        @keyframes breathAction {
            0%, 100% { transform: scale(1); opacity: 0.4; box-shadow: 0 0 10px var(--primary-gold); }
            50% { transform: scale(1.4); opacity: 0.9; box-shadow: 0 0 30px var(--primary-gold); }
        }

        /* --- 抽牌階段：3D 翻牌視覺 --- */
        .deck-wrapper {
            position: relative;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tarot-card {
            width: 180px;
            height: 310px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #1a1a1a;
        }

        /* 牌背 */
        .card-back {
            background: linear-gradient(45deg, #1a1a2e, #4a148c);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .card-back::after {
            content: "✨";
            font-size: 3rem;
            filter: drop-shadow(0 0 5px gold);
        }

        /* 牌面 */
        .card-front {
            transform: rotateY(180deg);
            z-index: 1;
            overflow: hidden;
        }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }

        /* 翻牌 + 放大核心 CSS */
        .tarot-card.is-flipped {
            transform: rotateY(180deg) scale(1.4) translateZ(50px);
        }

        /* 進度指示器 */
        .history-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .dot {
            width: 40px;
            height: 60px;
            border: 1px solid #444;
            border-radius: 4px;
            transition: 0.3s;
        }
        .dot.active { border-color: var(--primary-gold); background: rgba(212, 175, 55, 0.2); box-shadow: var(--glow); }

        /* --- 結果階段 --- */
        .result-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }
        .result-item {
            width: 140px;
            animation: resultPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes resultPop {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- 通用元件 --- */
        .btn {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }
        .btn:hover { background: var(--primary-gold); color: #000; box-shadow: var(--glow); }
        
        #copy-toast {
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-gold);
            color: #000;
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* RWD 微調 */
        @media (max-width: 600px) {
            .tarot-card.is-flipped { transform: rotateY(180deg) scale(1.1) translateZ(20px); }
            .result-item { width: 100px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-intro" class="screen active">
            <h1>數位塔羅顧問</h1>
            <div class="breath-guide">吸氣...吐氣</div>
            <p style="line-height: 2; max-width: 600px; margin: 0 auto;">
                「你好，我是你的數位塔羅顧問。在揭開命運的牌卡前，我們需要先建立連結。<br>
                請找一個安靜的空間坐好，深呼吸三次。<br>
                請在心中默想你的問題，直到它在腦海中變得清晰。<br>
                準備好後，點選『開始抽牌』。」
            </p>
            <button class="btn" onclick="goToDraw()">開始抽牌</button>
        </div>

        <div id="screen-draw" class="screen">
            <h2 id="draw-status">請專注於你的問題，然後點擊牌卡</h2>
            <div class="deck-wrapper">
                <div class="tarot-card" id="main-card" onclick="drawCard()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img src="" id="front-img" alt="塔羅牌">
                    </div>
                </div>
            </div>
            <div class="history-dots" id="history-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p id="draw-hint">準備抽出第 1 張牌...</p>
        </div>

        <div id="screen-result" class="screen">
            <h1>命運的揭曉</h1>
            <div class="result-grid" id="result-grid"></div>
            <button class="btn" onclick="copyResults()">複製名稱以供 AI 分析</button>
            <br>
            <button class="btn" style="border:none; font-size: 0.9rem; opacity: 0.6;" onclick="location.reload()">重新建立連結</button>
        </div>
    </div>

    <div id="copy-toast">牌組名稱已成功複製！</div>

    <script>
        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedIndices = [];
        let isDrawing = false;

        function goToDraw() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
        }

        function drawCard() {
            if (isDrawing || pickedIndices.length >= 3) return;
            isDrawing = true;

            // 1. 產生不重複隨機數
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * 78).toString().padStart(2, '0');
            } while (pickedIndices.includes(randomIndex));

            // 2. 準備正面圖
            const frontImg = document.getElementById('front-img');
            frontImg.src = `tarot_${randomIndex}.jpg`;
            // 若無圖片則使用色塊占位
            frontImg.onerror = () => { frontImg.src = `https://via.placeholder.com/180x310/222/d4af37?text=${tarotNames[randomIndex]}`; };

            // 3. 觸發 3D 翻牌與放大
            const card = document.getElementById('main-card');
            card.classList.add('is-flipped');

            // 4. 動畫演出時間軸
            setTimeout(() => {
                pickedIndices.push(randomIndex);
                
                // 更新進度點
                const dots = document.querySelectorAll('.dot');
                dots[pickedIndices.length - 1].classList.add('active');

                // 翻牌結束後，縮回並準備下一張
                setTimeout(() => {
                    card.classList.remove('is-flipped');
                    
                    if (pickedIndices.length === 3) {
                        setTimeout(showResults, 800);
                    } else {
                        document.getElementById('draw-hint').innerText = `準備抽出第 ${pickedIndices.length + 1} 張牌...`;
                        isDrawing = false;
                    }
                }, 1200); // 讓使用者看清楚牌的時間
            }, 800);
        }

        function showResults() {
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');

            const grid = document.getElementById('result-grid');
            grid.innerHTML = '';

            pickedIndices.forEach(idx => {
                grid.innerHTML += `
                    <div class="result-item">
                        <img src="tarot_${idx}.jpg" style="width:100%; border-radius:8px; border:1px solid gold;" onerror="this.src='https://via.placeholder.com/140x240/222/d4af37?text=Card'">
                        <p style="font-size:0.9rem; margin-top:10px; color:gold;">${tarotNames[idx]}</p>
                    </div>
                `;
            });
        }

        function copyResults() {
            const names = pickedIndices.map(idx => tarotNames[idx]).join('、');
            const text = `我抽到了三張塔羅牌：【${names}】。請根據這三張牌的象徵與我的問題，提供詳細的分析建議。`;
            
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.visibility = 'visible';
                setTimeout(() => toast.style.visibility = 'hidden', 2500);
            });
        }
    </script>
</body>
</html>
