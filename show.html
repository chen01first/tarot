<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位塔羅顧問 - 探索你的命運</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #1a1a2e;
            --text-light: #e0e0e0;
            --accent-purple: #4a148c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            padding: 20px;
        }

        /* 呼吸引導動畫 */
        .breath-guide {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            border-radius: 50%;
            margin: 30px auto;
            animation: breath 8s infinite ease-in-out;
            border: 1px solid var(--primary-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: var(--primary-gold);
        }

        @keyframes breath {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.8; }
        }

        /* 介面區塊切換 */
        .screen {
            display: none;
            animation: fadeIn 1s forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--primary-gold); letter-spacing: 3px; }
        p { line-height: 1.8; color: #bbb; }

        /* 按鈕設計 */
        .btn {
            background: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 50px;
            margin-top: 20px;
            outline: none;
        }

        .btn:hover {
            background: var(--primary-gold);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--primary-gold);
        }

        /* 抽牌過程展示 */
        .draw-status {
            font-size: 1.2rem;
            margin: 20px 0;
            color: var(--primary-gold);
        }

        /* 結果顯示區域 */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.3s;
        }

        .card-item:hover {
            transform: translateY(-10px);
            border-color: var(--primary-gold);
        }

        .card-img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .card-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin: 10px 0;
        }

        /* 複製按鈕 */
        .copy-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        #copy-toast {
            visibility: hidden;
            background-color: var(--primary-gold);
            color: var(--bg-dark);
            padding: 10px;
            border-radius: 5px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        #copy-toast.show {
            visibility: visible;
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-intro" class="screen active">
            <h1>數位塔羅顧問</h1>
            <div class="breath-guide">深呼吸</div>
            <p>
                「你好，我是你的數位塔羅顧問。在揭開命運的牌卡前，我們需要先建立連結。<br>
                請找一個安靜的空間坐好，深呼吸三次。<br>
                請在心中默想你的問題，直到它在腦海中變得清晰。<br>
                準備好後，點選『開始抽牌』。」
            </p>
            <button class="btn" onclick="startDrawing()">開始抽牌</button>
        </div>

        <div id="screen-draw" class="screen">
            <h1>建立連結中...</h1>
            <div class="draw-status">請點選牌堆抽牌 (<span id="draw-count">0</span> / 3)</div>
            <div id="deck-area">
                <img src="tarot_back.jpg" alt="牌背" style="width: 180px; cursor: pointer; filter: sepia(1);" onclick="pickACard()">
            </div>
            <p>感受能量，點擊上方牌組抽出第 <span id="next-card-num">一</span> 張牌</p>
        </div>

        <div id="screen-result" class="screen">
            <h1>揭曉結果</h1>
            <div class="result-grid" id="result-display">
                </div>
            
            <div class="copy-section">
                <button class="btn" onclick="copyResults()">複製牌名以供 AI 分析</button>
                <br>
                <button class="btn" style="border-color: #666; color: #666; font-size: 0.8rem;" onclick="location.reload()">重新占卜</button>
            </div>
        </div>
    </div>

    <div id="copy-toast">牌名已複製！</div>

    <script>
        // 塔羅牌數據
        const tarotData = {
            "00": "愚者", "01": "魔術師", "02": "女祭司", "03": "皇后", "04": "皇帝", "05": "教皇", "06": "戀人", "07": "戰車", "08": "力量", "09": "隱者", "10": "命運之輪", "11": "正義", "12": "倒吊人", "13": "死神", "14": "節制", "15": "惡魔", "16": "塔", "17": "星星", "18": "月亮", "19": "太陽", "20": "審判", "21": "世界",
            "22": "權杖王牌", "23": "權杖二", "24": "權杖三", "25": "權杖四", "26": "權杖五", "27": "權杖六", "28": "權杖七", "29": "權杖八", "30": "權杖九", "31": "權杖十", "32": "權杖侍者", "33": "權杖騎士", "34": "權杖王后", "35": "權杖國王",
            "36": "聖杯王牌", "37": "聖杯二", "38": "聖杯三", "39": "聖杯四", "40": "聖杯五", "41": "聖杯六", "42": "聖杯七", "43": "聖杯八", "44": "聖杯九", "45": "聖杯十", "46": "聖杯侍者", "47": "聖杯騎士", "48": "聖杯王后", "49": "聖杯國王",
            "50": "寶劍王牌", "51": "寶劍二", "52": "寶劍三", "53": "寶劍四", "54": "寶劍五", "55": "寶劍六", "56": "寶劍七", "57": "寶劍八", "58": "寶劍九", "59": "寶劍十", "60": "寶劍侍者", "61": "寶劍騎士", "62": "寶劍王后", "63": "寶劍國王",
            "64": "錢幣王牌", "65": "錢幣二", "66": "錢幣三", "67": "錢幣四", "68": "錢幣五", "69": "錢幣六", "70": "錢幣七", "71": "錢幣八", "72": "錢幣九", "73": "錢幣十", "74": "錢幣侍者", "75": "錢幣騎士", "76": "錢幣王后", "77": "錢幣國王"
        };

        let pickedIndices = [];
        const chineseNums = ["一", "二", "三"];

        function startDrawing() {
            showScreen('screen-draw');
        }

        function pickACard() {
            if (pickedIndices.length >= 3) return;

            // 隨機抽取 00-77 且不重複
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * 78).toString().padStart(2, '0');
            } while (pickedIndices.includes(randomIndex));

            pickedIndices.push(randomIndex);
            
            // 更新計數
            document.getElementById('draw-count').innerText = pickedIndices.length;
            if (pickedIndices.length < 3) {
                document.getElementById('next-card-num').innerText = chineseNums[pickedIndices.length];
            }

            // 如果抽滿三張，延遲切換到結果
            if (pickedIndices.length === 3) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            const display = document.getElementById('result-display');
            display.innerHTML = '';

            pickedIndices.forEach(idx => {
                const cardName = tarotData[idx];
                const cardHtml = `
                    <div class="card-item">
                        <img src="tarot_${idx}.jpg" class="card-img" alt="${cardName}" onerror="this.src='https://via.placeholder.com/200x350/222/d4af37?text=Tarot+${idx}'">
                        <div class="card-name">${cardName}</div>
                    </div>
                `;
                display.innerHTML += cardHtml;
            });

            showScreen('screen-result');
        }

        function copyResults() {
            const names = pickedIndices.map(idx => tarotData[idx]).join('、');
            const textToCopy = `我的塔羅占卜結果是：${names}。請幫我分析這三張牌對我問題的啟示。`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
