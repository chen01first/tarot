<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位塔羅：命運之門與能量導引</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #080810;
            --text-light: #e0e0e0;
            --accent-purple: #1a0b2e;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; perspective: 1500px;
        }

        .container { width: 95%; max-width: 800px; text-align: center; padding: 20px; }

        /* --- 呼吸動畫 --- */
        .breath-wrapper {
            position: relative; width: 120px; height: 120px; margin: 20px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .breath-circle {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
            border: 2px solid var(--primary-gold); border-radius: 50%;
            animation: breathCycle 8s infinite ease-in-out;
        }
        .breath-text { position: relative; z-index: 2; color: var(--primary-gold); font-size: 0.8rem; font-weight: bold; }

        @keyframes breathCycle {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.9; box-shadow: 0 0 30px var(--primary-gold); }
        }

        /* --- 畫面切換 --- */
        .screen { display: none; animation: screenFade 0.6s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; } to { opacity: 1; } }

        /* --- 儀式感文案 --- */
        .ritual-content { text-align: left; line-height: 1.6; margin-bottom: 20px; }
        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 15px 0 5px 0; border-left: 3px solid var(--primary-gold); padding-left: 10px; }
        .ritual-p { color: #aaa; margin: 0 0 10px 0; font-size: 0.9rem; }

        /* --- 問題選單樣式 --- */
        .question-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px; text-align: left; background: rgba(255,255,255,0.03);
            padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(212,175,55,0.1);
        }
        .q-item { font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; color: #ccc; padding: 5px; border-radius: 5px; transition: 0.3s; }
        .q-item:hover { background: rgba(212,175,55,0.1); }
        .q-item input { margin-right: 8px; accent-color: var(--primary-gold); }

        /* --- 擴展導引面板 --- */
        .expand-trigger {
            color: var(--primary-gold); font-size: 0.9rem; cursor: pointer;
            text-decoration: underline; margin-bottom: 15px; display: block;
        }
        .guide-panel {
            max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out;
            background: rgba(0,0,0,0.3); border-radius: 10px; text-align: left;
        }
        .guide-panel.open { max-height: 1000px; padding: 15px; border: 1px dashed rgba(212,175,55,0.3); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.8rem; color: var(--primary-gold); margin-bottom: 5px; }
        .form-input, .form-select {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #444;
            color: white; padding: 8px; border-radius: 5px; font-size: 0.85rem; box-sizing: border-box;
        }

        /* --- 抽牌區 --- */
        .card-zone { height: 320px; display: flex; justify-content: center; align-items: center; }
        .tarot-card {
            width: 160px; height: 275px; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 12px; border: 2px solid var(--primary-gold); background: #111;
        }
        .card-back { background: linear-gradient(135deg, #1a1a2e, #4a148c); display: flex; justify-content: center; align-items: center; }
        .card-back::after { content: "◈"; color: var(--primary-gold); font-size: 2.5rem; }
        .card-front { transform: rotateY(180deg); overflow: hidden; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        .tarot-card.flipped { transform: rotateY(180deg) scale(1.25) translateZ(50px); }

        /* --- 結果與分析 --- */
        .result-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .card-result { width: 100px; text-align: center; font-size: 0.75rem; color: var(--primary-gold); }
        .card-result img { width: 100%; border-radius: 8px; border: 1px solid gold; margin-bottom: 5px; }

        .btn {
            background: transparent; border: 1.5px solid var(--primary-gold);
            color: var(--primary-gold); padding: 12px 25px; border-radius: 50px;
            cursor: pointer; transition: 0.3s; font-size: 0.95rem; margin: 5px;
            text-decoration: none; display: inline-block;
        }
        .btn:hover { background: var(--primary-gold); color: #000; box-shadow: 0 0 20px var(--primary-gold); }
        .btn-main { background: var(--primary-gold); color: #000; font-weight: bold; }

        #toast {
            visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--primary-gold); color: #000; padding: 10px 30px; border-radius: 8px; font-weight: bold; z-index: 999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-intro" class="screen active">
            <div class="ritual-content">
                <p>「辛苦了。外面的世界很吵吧？進到這裡，讓心靜下來。」</p>
                <div class="ritual-header">【調頻：卸下重擔】</div>
                <p class="ritual-p">隨圓圈律動深呼吸。想像壓力排空，感受這份專屬於你的安穩。</p>
                <div class="ritual-header">【觀想：化繁為簡】</div>
                <p class="ritual-p">請選擇你想請示的方向。別擔心，這裡會接住你的迷惘。</p>
            </div>

            <div class="question-grid">
                <label class="q-item"><input type="radio" name="q" value="感情發展" checked> 感情發展</label>
                <label class="q-item"><input type="radio" name="q" value="復合可能"> 復合可能</label>
                <label class="q-item"><input type="radio" name="q" value="職涯發展"> 職涯發展</label>
                <label class="q-item"><input type="radio" name="q" value="正緣桃花"> 正緣桃花</label>
                <label class="q-item"><input type="radio" name="q" value="財運投資"> 財運投資</label>
                <label class="q-item"><input type="radio" name="q" value="職場人際"> 職場人際</label>
                <label class="q-item"><input type="radio" name="q" value="身心健康"> 身心健康</label>
                <label class="q-item"><input type="radio" name="q" value="自我探索"> 自我探索</label>
                <label class="q-item"><input type="radio" name="q" value="二選一決策"> 二選一決策</label>
                <label class="q-item"><input type="radio" name="q" value="其它問題"> 其它問題</label>
            </div>

            <span class="expand-trigger" onclick="toggleGuide()">✦ 點擊展開：提供更多細節（推薦，讓分析更精準）</span>
            <div id="guide-panel" class="guide-panel">
                <div class="form-group">
                    <span class="form-label">1. 問題結構化 (身分/現況/期限)</span>
                    <input type="text" id="g-who" class="form-input" placeholder="我是：[性別/職業/狀態]">
                    <input type="text" id="g-target" class="form-input" style="margin-top:5px" placeholder="我的目標：[想加薪/想復合...]">
                    <input type="text" id="g-time" class="form-input" style="margin-top:5px" placeholder="觀察期限：[年底前/三個月內]">
                </div>
                <div class="form-group">
                    <span class="form-label">2. 關係動力 (適用感情/人際)</span>
                    <select id="g-rel-role" class="form-select">
                        <option value="">對方角色：未指定</option>
                        <option value="前任">前任</option>
                        <option value="主管">主管</option>
                        <option value="同事/競爭對手">同事/競爭對手</option>
                    </select>
                    <input type="text" id="g-rel-freq" class="form-input" style="margin-top:5px" placeholder="互動頻率：[斷聯/每天見面...]">
                </div>
                <div class="form-group">
                    <span class="form-label">3. 行動與現實阻礙</span>
                    <input type="text" id="g-act" class="form-input" placeholder="已執行的行動：[已主動聯繫/已投履歷...]">
                    <input type="text" id="g-obs" class="form-input" style="margin-top:5px" placeholder="現實阻礙：[遠距離/房貸壓力...]">
                </div>
                <div class="form-group">
                    <span class="form-label">4. 決策模擬 (二選一選填)</span>
                    <input type="text" id="g-path-a" class="form-input" placeholder="路徑 A：[留在原公司]">
                    <input type="text" id="g-path-b" class="form-input" style="margin-top:5px" placeholder="路徑 B：[跳槽新環境]">
                </div>
            </div>

            <div class="breath-wrapper">
                <div class="breath-circle"></div>
                <div class="breath-text" id="b-text">吸氣...</div>
            </div>
            <button class="btn btn-main" onclick="goToDraw()">開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-label">觀想你的能量，點擊卡牌</h3>
            <div class="card-zone">
                <div class="tarot-card" id="tarot-card" onclick="doPick()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"><img src="" id="front-img"></div>
                </div>
            </div>
            <div id="progress-dots" style="display:flex; justify-content:center; gap:10px;">
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold);">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            <div class="mode-box">
                <label><input type="radio" name="mode" value="normal" checked> 一般解析</label>
                &nbsp;&nbsp;
                <label><input type="radio" name="mode" value="think"> 🧠 深度思考/推理模式</label>
            </div>
            <button class="btn btn-main" onclick="copyResult()">步驟 1：複製牌名與背景資料</button>
            <p style="font-size: 0.8rem; opacity: 0.6; margin: 15px 0; color: var(--primary-gold);">✦ 點擊「進行分析」後，在對話框貼上並送出即可。 ✦</p>
            <a href="https://gemini.google.com/gem/18WL9EmeoeViSQzbawESUo6s9dyVFC2e8?usp=sharing" target="_blank" class="btn">步驟 2：進行分析</a>
            <br>
            <button class="btn" style="border:none; font-size:0.8rem; opacity:0.4; margin-top:20px;" onclick="location.reload()">重新調頻</button>
        </div>
    </div>
    <div id="toast">已複製結構化問題與牌組！</div>

    <script>
        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedIds = [];
        let picking = false;
        let contextData = {};

        function toggleGuide() {
            document.getElementById('guide-panel').classList.toggle('open');
        }

        setInterval(() => {
            const bt = document.getElementById('b-text');
            bt.innerText = bt.innerText === "吸氣..." ? "吐氣..." : "吸氣...";
        }, 4000);

        function goToDraw() {
            // 抓取所有輸入資料
            contextData = {
                mainQ: document.querySelector('input[name="q"]:checked').value,
                who: document.getElementById('g-who').value,
                target: document.getElementById('g-target').value,
                time: document.getElementById('g-time').value,
                relRole: document.getElementById('g-rel-role').value,
                relFreq: document.getElementById('g-rel-freq').value,
                act: document.getElementById('g-act').value,
                obs: document.getElementById('g-obs').value,
                pathA: document.getElementById('g-path-a').value,
                pathB: document.getElementById('g-path-b').value
            };
            nextScreen('screen-draw');
        }

        function nextScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function doPick() {
            if (picking || pickedIds.length >= 3) return;
            picking = true;
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedIds.includes(rid));
            
            const img = document.getElementById('front-img');
            img.src = `tarot_${rid}.jpg`;
            img.onerror = () => { img.src = `https://via.placeholder.com/160x275/222/d4af37?text=${tarotNames[rid]}`; };
            
            const card = document.getElementById('tarot-card');
            card.classList.add('flipped');
            
            setTimeout(() => {
                pickedIds.push(rid);
                document.querySelectorAll('.p-dot')[pickedIds.length - 1].style.background = 'var(--primary-gold)';
                setTimeout(() => {
                    card.classList.remove('flipped');
                    if (pickedIds.length === 3) { setTimeout(showFinal, 800); }
                    else { 
                        document.getElementById('draw-label').innerText = `已連結 ${pickedIds.length} 張能量，續抽下一張...`;
                        picking = false; 
                    }
                }, 1500);
            }, 800);
        }

        function showFinal() {
            nextScreen('screen-result');
            const row = document.getElementById('result-row');
            row.innerHTML = '';
            pickedIds.forEach(id => {
                row.innerHTML += `<div class="card-result"><img src="tarot_${id}.jpg" onerror="this.src='https://via.placeholder.com/100x160/222/d4af37?text=Card'"><p>${tarotNames[id]}</p></div>`;
            });
        }

        function copyResult() {
            const cards = pickedIds.map(id => tarotNames[id]).join('、');
            const mode = document.querySelector('input[name="mode"]:checked').value;
            
            let structuredPrompt = `【塔羅占卜委託】\n`;
            structuredPrompt += `核心問題：${contextData.mainQ}\n`;
            if(contextData.who || contextData.target) structuredPrompt += `1. 問題背景：我是 ${contextData.who || '未提供'}，目標是 ${contextData.target || '未提供'}，觀察期限為 ${contextData.time || '未指定'}\n`;
            if(contextData.relRole) structuredPrompt += `2. 關係動力：對方是 ${contextData.relRole}，互動頻率為 ${contextData.relFreq || '未描述'}\n`;
            if(contextData.act || contextData.obs) structuredPrompt += `3. 現實狀態：已執行行為[${contextData.act || '無'}]，現實阻礙[${contextData.obs || '無'}]\n`;
            if(contextData.pathA) structuredPrompt += `4. 決策路徑：路徑A[${contextData.pathA}] vs 路徑B[${contextData.pathB || '未設定'}]\n`;
            structuredPrompt += `\n【抽中牌組】：${cards}\n\n`;
            
            if (mode === 'think') {
                structuredPrompt += `請啟動【深度思考/推理模式】。請結合上述結構化背景，運用塔羅符號學與心理映射進行嚴密分析，並給予具備策略性的行動指引。`;
            } else {
                structuredPrompt += `請針對我的問題提供專業解析，給予溫暖且具體的指引建議。`;
            }

            navigator.clipboard.writeText(structuredPrompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
