<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開運塔羅：開啟命運之門</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #080810;
            --text-light: #e0e0e0;
            --accent-purple: #2a1b4e;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1500px;
        }

        .container { width: 90%; max-width: 700px; text-align: center; padding: 20px; }

        /* --- 呼吸與引導動畫 --- */
        .breath-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .breath-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            animation: breathCycle 8s infinite ease-in-out;
            box-shadow: var(--glow);
        }

        .breath-text {
            position: relative;
            z-index: 2;
            color: var(--primary-gold);
            font-weight: bold;
            letter-spacing: 2px;
            animation: textFade 8s infinite ease-in-out;
        }

        @keyframes breathCycle {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.4); opacity: 0.9; box-shadow: 0 0 40px var(--primary-gold); }
        }

        @keyframes textFade {
            0%, 10%, 90%, 100% { opacity: 0.5; content: "吐氣..."; }
            40%, 60% { opacity: 1; content: "吸氣..."; }
        }

        /* --- 畫面切換 --- */
        .screen { display: none; animation: screenFade 1.2s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; } to { opacity: 1; } }

        /* --- 引導文案排版 --- */
        .ritual-content { text-align: left; line-height: 1.8; margin-bottom: 40px; }
        .ritual-section { margin-bottom: 25px; }
        .ritual-header { 
            color: var(--primary-gold); 
            font-size: 1.1rem; 
            font-weight: bold; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .ritual-header::before { content: "✦"; margin-right: 10px; }
        .ritual-p { padding-left: 24px; color: #aaa; margin: 0; }

        /* --- 抽牌視覺 --- */
        .card-zone { height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .tarot-card {
            width: 180px; height: 310px; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            border: 2px solid var(--primary-gold); background: #111;
        }
        .card-back {
            background: linear-gradient(135deg, #1a1a2e 0%, #4a148c 100%);
            display: flex; justify-content: center; align-items: center;
        }
        .card-back::after { content: "◈"; color: var(--primary-gold); font-size: 3rem; }
        .card-front { transform: rotateY(180deg); overflow: hidden; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        .tarot-card.flipped { transform: rotateY(180deg) scale(1.3) translateZ(50px); }

        /* --- 結果與 AI 整合 --- */
        .result-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px 0; }
        .card-result { width: 120px; text-align: center; font-size: 0.85rem; }
        .card-result img { width: 100%; border-radius: 8px; border: 1px solid gold; margin-bottom: 10px; }

        .btn {
            background: transparent; border: 1.5px solid var(--primary-gold);
            color: var(--primary-gold); padding: 14px 30px; border-radius: 50px;
            cursor: pointer; transition: 0.3s; font-size: 1rem; margin: 8px;
            text-decoration: none; display: inline-block;
        }
        .btn:hover { background: var(--primary-gold); color: #000; box-shadow: 0 0 20px var(--primary-gold); }
        .btn-main { background: var(--primary-gold); color: #000; font-weight: bold; }

        #toast {
            visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--primary-gold); color: #000; padding: 12px 30px; border-radius: 8px; font-weight: bold;
            z-index: 999;
        }

        @media (max-width: 600px) {
            .ritual-p { font-size: 0.95rem; }
            .tarot-card.flipped { transform: rotateY(180deg) scale(1.1); }
            .btn { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-intro" class="screen active">
            <div class="ritual-content">
                <p>「辛苦了。外面的世界很吵吧？進到這裡，讓心靜下來。我是你的數位塔羅顧問。」<br>
                <small style="opacity: 0.6;">這裡不需要正確答案，只需要你最真實的倒影。</small></p>

                <div class="ritual-section">
                    <div class="ritual-header">【調頻：卸下重擔】</div>
                    <p class="ritual-p">就在原地，隨圓圈的律動深、呼、吸。想像吐氣時，那些「不得不」的壓力正隨煙霧排空。感受這份專屬於你的安穩。</p>
                </div>

                <div class="ritual-section">
                    <div class="ritual-header">【觀想：化繁為簡】</div>
                    <p class="ritual-p">你想問的內容觀想在腦海中。別擔心，這裡會接住你的迷惘。</p>
                </div>
            </div>

            <div class="breath-wrapper">
                <div class="breath-circle"></div>
                <div class="breath-text" id="b-text">吸氣...</div>
            </div>

            <p style="color: var(--primary-gold); font-size: 0.9rem;">準備好後，請點擊開啟</p>
            <button class="btn btn-main" onclick="nextScreen('screen-draw')">開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-label">感受腦海中的觀想，點擊卡牌</h3>
            <div class="card-zone">
                <div class="tarot-card" id="tarot-card" onclick="doPick()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img src="" id="front-img">
                    </div>
                </div>
            </div>
            <div id="progress-dots" style="display:flex; justify-content:center; gap:10px;">
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold);">揭曉：命運的倒影</h2>
            <div class="result-row" id="result-row"></div>

            <div class="action-steps">
                <button class="btn btn-main" onclick="copyResult()">步驟 1：複製分析指令</button>
                <br>
                <a href="https://gemini.google.com/gem/18WL9EmeoeViSQzbawESUo6s9dyVFC2e8?usp=sharing" 
                   target="_blank" class="btn">步驟 2：進行分析</a>
                <p style="font-size: 0.8rem; opacity: 0.5;">點擊「進行分析」後，在對話框貼上並送出即可。</p>
                <button class="btn" style="border:none; font-size:0.8rem; opacity:0.4;" onclick="location.reload()">重新調頻</button>
            </div>
        </div>
    </div>

    <div id="toast">分析指令已複製</div>

    <script>
        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedIds = [];
        let picking = false;

        setInterval(() => {
            const bt = document.getElementById('b-text');
            if(bt) bt.innerText = bt.innerText === "吸氣..." ? "吐氣..." : "吸氣...";
        }, 4000);

        function nextScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function doPick() {
            if (picking || pickedIds.length >= 3) return;
            picking = true;

            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedIds.includes(rid));

            const img = document.getElementById('front-img');
            const card = document.getElementById('tarot-card');

            // 修正點 1: 先更新圖片路徑，再觸發翻牌動畫
            img.src = `tarot_${rid}.jpg`;
            img.onerror = () => { img.src = `https://via.placeholder.com/180x310/222/d4af37?text=${tarotNames[rid]}`; };

            // 稍微延遲 50ms 確保瀏覽器已處理 src 變更再翻面，避免看到舊圖
            setTimeout(() => {
                card.classList.add('flipped');
            }, 50);

            setTimeout(() => {
                pickedIds.push(rid);
                document.querySelectorAll('.p-dot')[pickedIds.length - 1].style.background = 'var(--primary-gold)';
                
                setTimeout(() => {
                    card.classList.remove('flipped');
                    
                    // 修正點 2: 在牌面翻轉回去的動畫期間，非同步清空 src，確保下次抽牌是乾淨的狀態
                    setTimeout(() => {
                        img.src = ""; 
                        if (pickedIds.length === 3) {
                            showFinal();
                        } else {
                            document.getElementById('draw-label').innerText = `已感受第 ${pickedIds.length} 張牌，請抽下一張...`;
                            picking = false;
                        }
                    }, 800); // 這裡的 800ms 對應 CSS 的 transition 時間
                }, 1500);
            }, 800);
        }

        function showFinal() {
            nextScreen('screen-result');
            const row = document.getElementById('result-row');
            row.innerHTML = '';
            pickedIds.forEach(id => {
                row.innerHTML += `<div class="card-result">
                    <img src="tarot_${id}.jpg" onerror="this.src='https://via.placeholder.com/120x200/222/d4af37?text=Card'">
                    <p>${tarotNames[id]}</p>
                </div>`;
            });
        }

        function copyResult() {
            const names = pickedIds.map(id => tarotNames[id]).join('、');
            // 修正點 3: 固定使用深度思考模式的 Prompt 開頭
            const prompt = `請啟動【深度思考/推理模式】。我觀想的問題已具象化，抽出的牌組為：【${names}】。請運用占星對應、象徵主義與行為心理學，進行多維度的邏輯推演，並給予我突破性的分析與指引。`;

            navigator.clipboard.writeText(prompt).then(() => {
                const toast = document.getElementById('toast');
                toast.style.visibility = 'visible';
                setTimeout(() => toast.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
