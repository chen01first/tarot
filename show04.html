<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位塔羅：星辰之眼</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #05050a;
            --text-light: #e0e0e0;
            --accent-purple: #4a148c;
            --energy-pink: #ff4081;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            overflow-x: hidden; overflow-y: auto; perspective: 1500px;
        }

        .container { 
            width: 100%; max-width: 800px; text-align: center; 
            padding: 20px 15px 100px 15px; margin: auto; position: relative; z-index: 10; 
        }

        /* --- 1. 開場儀式感 --- */
        #screen-ritual-opening {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05050a 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease, filter 1.5s ease;
        }
        .energy-heart {
            position: absolute; width: 300px; height: 300px; background: var(--energy-pink); filter: blur(80px); opacity: 0.4; border-radius: 50%; animation: heartPulse 4s infinite ease-in-out; z-index: 1; pointer-events: none;
        }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.6; } }
        .floating-cards-ritual {
            position: relative; width: 300px; height: 200px; transform-style: preserve-3d; animation: rotateScene 20s infinite linear; z-index: 5; cursor: pointer;
        }
        .mini-card { position: absolute; width: 80px; height: 130px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary-gold); border-radius: 5px; backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; backface-visibility: hidden; }
        .c1 { transform: rotateY(0deg) translateZ(120px); }
        .c2 { transform: rotateY(120deg) translateZ(120px); }
        .c3 { transform: rotateY(240deg) translateZ(120px); }
        @keyframes rotateScene { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .ritual-table { position: absolute; bottom: 0; width: 100%; height: 25vh; background: linear-gradient(to top, #1a0510, transparent); z-index: 2; }

        /* --- 2. 螢幕切換 --- */
        .screen { display: none; width: 100%; animation: screenFade 0.8s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 3. 選單頁面 --- */
        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 25px 0 10px 0; border-left: 4px solid var(--primary-gold); padding-left: 12px; text-align: left; }
        .category-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; margin-bottom: 20px; }
        .cat-btn { padding: 10px 18px; border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .cat-btn.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); font-weight: bold; }
        .sub-theme-list { text-align: left; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(212,175,55,0.1); overflow: hidden; margin-bottom: 20px; }
        .sub-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: flex-start; }
        .sub-item.selected { background: rgba(212,175,55,0.15); border-left: 5px solid var(--primary-gold); }
        .detail-panel { background: rgba(212, 175, 55, 0.05); border: 1px dashed var(--primary-gold); border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; }
        .form-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 15px; border-radius: 8px; font-size: 1rem; outline: none; }
        #validate-msg { color: #ff4081; font-size: 0.85rem; margin-bottom: 20px; display: block; font-weight: bold; }

        /* --- 4. 修正：混沌洗牌與抽牌區 --- */
        .draw-container { position: relative; width: 100%; height: 550px; margin-top: 10px; overflow: visible; display: flex; flex-direction: column; align-items: center; }
        
        /* 洗牌區：360度混亂旋轉 */
        .shuffle-zone { position: relative; width: 120px; height: 180px; margin-top: 150px; }
        .deck-card { 
            position: absolute; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #1a1a2e, #4a148c);
            border: 1.5px solid var(--primary-gold); border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            top: 0; left: 0;
        }
        .shuffling .deck-card { animation: chaoticShuffle 1.2s infinite ease-in-out; }
        
        @keyframes chaoticShuffle {
            0% { transform: translate(0, 0) rotate(0deg); z-index: 1; }
            25% { transform: translate(120px, -80px) rotate(180deg); z-index: 5; }
            50% { transform: translate(-120px, 80px) rotate(360deg); z-index: 10; }
            75% { transform: translate(120px, 80px) rotate(540deg); z-index: 5; }
            100% { transform: translate(0, 0) rotate(720deg); z-index: 1; }
        }

        /* 弧形牌陣區 */
        .fan-spread { position: absolute; width: 100%; height: 350px; bottom: 0; left: 0; display: none; justify-content: center; align-items: flex-end; padding-bottom: 100px; }
        .fan-card {
            position: absolute; width: 70px; height: 120px;
            background: linear-gradient(135deg, #1a1a2e, #4a148c);
            border: 1px solid var(--primary-gold); border-radius: 6px;
            cursor: pointer; transform-origin: center 280px;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s, opacity 0.4s;
            display: flex; justify-content: center; align-items: center; color: rgba(212,175,55,0.3);
        }
        .fan-card:hover { box-shadow: 0 0 20px var(--primary-gold); z-index: 200; }
        
        /* 抽出的牌：向上移動並鎖定 */
        .fan-card.picked {
            transform: translateY(-380px) scale(1.1) rotate(0deg) !important;
            z-index: 500;
            box-shadow: 0 0 30px var(--primary-gold);
            cursor: default;
        }
        /* 根據抽出的順序決定 X 位移，排成一列 */
        .fan-card.pick-0 { transform: translate(-85px, -380px) scale(1.1) rotate(0deg) !important; }
        .fan-card.pick-1 { transform: translate(0px, -380px) scale(1.1) rotate(0deg) !important; }
        .fan-card.pick-2 { transform: translate(85px, -380px) scale(1.1) rotate(0deg) !important; }

        /* --- 5. 結果與雙步驟 --- */
        .result-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px auto; }
        .card-result { width: calc(33% - 15px); min-width: 110px; text-align: center; color: var(--primary-gold); font-weight: bold; }
        .card-result img { width: 100%; border-radius: 10px; border: 2px solid gold; margin-bottom: 10px; }
        .reversed-img { transform: rotate(180deg); }

        .step-box { margin: 20px auto; max-width: 450px; text-align: center; }
        .step-hint { display: block; font-size: 0.9rem; color: #888; margin-top: 10px; }
        .btn { background: transparent; border: 1.5px solid var(--primary-gold); color: var(--primary-gold); padding: 16px 45px; border-radius: 50px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; font-weight: bold; text-decoration: none; display: inline-block; width: 100%; }
        .btn:disabled { border-color: #444; color: #666; cursor: not-allowed; opacity: 0.5; }
        .btn:not(:disabled):hover { background: var(--primary-gold); color: #000; box-shadow: var(--glow); }
        .btn-main { background: var(--primary-gold); color: #000; border: none; }

        #toast { visibility: hidden; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary-gold); color: #000; padding: 12px 30px; border-radius: 8px; font-weight: bold; z-index: 10000; }

        @media (max-width: 600px) {
            .fan-card { width: 55px; height: 95px; transform-origin: center 200px; }
            .draw-container { height: 480px; }
            .fan-card.pick-0 { transform: translate(-65px, -350px) scale(1) rotate(0deg) !important; }
            .fan-card.pick-1 { transform: translate(0px, -350px) scale(1) rotate(0deg) !important; }
            .fan-card.pick-2 { transform: translate(65px, -350px) scale(1) rotate(0deg) !important; }
        }
    </style>
</head>
<body>

    <div id="screen-ritual-opening" onclick="start转场儀式()">
        <div class="energy-heart"></div>
        <div class="floating-cards-ritual">
            <div class="mini-card c1"></div><div class="mini-card c2"></div><div class="mini-card c3"></div>
        </div>
        <div class="ritual-table"></div>
        <div style="position:relative; z-index:10; margin-top:200px;">
            <h2 style="color: var(--primary-gold); letter-spacing: 8px;">星辰之眼</h2>
            <p style="color: #888; font-size: 0.9rem; letter-spacing: 4px;">點擊能量中心 · 進入觀想</p>
        </div>
    </div>

    <div class="container">
        <div id="screen-intro" class="screen">
            <div class="ritual-header">【第一步：選擇能量領域】</div>
            <div class="category-grid" id="category-selector"></div>
            <div class="ritual-header">【第二步：點選靈魂提問】</div>
            <div class="sub-theme-list" id="sub-theme-list"><p style="padding: 20px; color: #666;">請先選擇領域...</p></div>
            <div class="ritual-header">【第三步：補充背景 (選填)】</div>
            <div class="detail-panel"><textarea class="form-input" id="custom-context" rows="2" placeholder="您可以輸入具體內容讓解析更精準..."></textarea></div>
            <span id="validate-msg">請點選一個提問</span>
            <button class="btn btn-main" id="start-btn" onclick="goToDraw()" disabled>開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-info" style="color: var(--primary-gold); letter-spacing: 2px;">連結集體潛意識...</h3>
            <div class="draw-container">
                <div id="shuffle-deck" class="shuffle-zone shuffling"></div>
                <div id="fan-spread" class="fan-spread"></div>
            </div>
            <div id="draw-controls">
                <button class="btn btn-main" id="stop-shuffle-btn" onclick="stopShuffle()">感應結束，停止洗牌</button>
                <p id="fan-hint" style="display:none; color: #888; margin-top:15px;">✦ 連點 2 下選取有感應的牌 (已抽 <span id="picked-count">0</span>/3) ✦</p>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold); margin-bottom: 20px;">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            <div class="step-box">
                <button class="btn btn-main" onclick="copyResult()">點選步驟 1</button>
                <span class="step-hint">複製占卜指令 (啟動深度思考)</span>
            </div>
            <div class="step-box">
                <a href="https://gemini.google.com/" target="_blank" class="btn">點選步驟 2</a>
                <span class="step-hint">前往 Gemini 貼上並送出</span>
            </div>
            <br>
            <button class="btn" style="border:none; font-size:0.8rem; opacity:0.4; width:auto;" onclick="location.reload()">重新調頻</button>
        </div>
    </div>

    <div id="toast">指令已成功注入靈魂！</div>

    <script>
        const themes = {
            "感情與關係": ["能量狀態： 我們目前互動的能量流向與心理動力處於什麼樣的階段？", "對方感受： 對方內心對我的定位，以及他對這段關係的真實想法為何？", "核心問題： 阻礙我們關係深入發展的最關鍵瓶頸是什麼？", "聯絡發展： 若我採取主動聯絡，雙方的互動未來走向可能產生什麼質變？", "關係功課： 這段關係正引領我面對哪些個人成長課題或靈魂契機？", "心理盲點： 在這段感情中，有哪些我尚未察覺的真實狀況？", "下段準備： 在迎接下一段良緣之前，我需要先完成哪些能量清理？"],
            "工作與職涯": ["離職轉型： 離開現有職位對我的生命路徑會產生什麼結構性影響？", "優勢定位： 結合我的天賦與市場趨勢，最能發揮我價值的工作藍圖？", "現況啟示： 近期職場挑戰，是為了訓練我具備哪種更高階能力？", "機會對比： 面前這兩個選項，分別代表哪兩種不同的生命擴張方向？", "阻礙覺察： 是什麼潛意識限制或思維框架讓我感覺原地踏步？"],
            "金錢與豐盛": ["金錢能量： 我目前的財務流動狀態與內在豐盛感是否一致？", "匱乏根源： 我對金錢的不安全感，本質上是在恐懼什麼樣的人生狀態？", "調頻豐盛： 我可以如何優化頻率，讓金錢更順暢地流向我？", "財富課題： 在這個階段，金錢試圖教導我關於「價值」的什麼功課？"],
            "自我探索與成長": ["我最近一直覺得很迷惘，內在到底在渴望什麼？", "我覺得人生卡住了，這個「卡住」的背後是什麼能量？", "人生卡住了，那個突破點是什麼？", "我的靈魂最想讓我知道的一件事是什麼？", "我的高我想對我說的一句話？", "從高我的角度來看，我的天賦是什麼？"]
        };

        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedCards = [];
        let selectedCategory = "";
        let selectedQuestion = "";

        function start转场儀式() {
            document.getElementById('screen-ritual-opening').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('screen-ritual-opening').style.display = "none";
                document.getElementById('screen-intro').classList.add('active');
                initCategories();
            }, 1200);
        }

        function initCategories() {
            const container = document.getElementById('category-selector');
            container.innerHTML = "";
            Object.keys(themes).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "cat-btn";
                btn.innerText = cat;
                btn.onclick = () => selectCategory(cat, btn);
                container.appendChild(btn);
            });
        }

        function selectCategory(cat, btn) {
            selectedCategory = cat; selectedQuestion = "";
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const subList = document.getElementById('sub-theme-list');
            subList.innerHTML = "";
            themes[cat].forEach(q => {
                const item = document.createElement('div');
                item.className = "sub-item";
                item.innerHTML = `<div class="sub-text">${q}</div>`;
                item.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedQuestion = q;
                    validateForm();
                };
                subList.appendChild(item);
            });
            validateForm();
        }

        function validateForm() {
            const btn = document.getElementById('start-btn');
            const msg = document.getElementById('validate-msg');
            if (selectedQuestion) { btn.disabled = false; msg.style.opacity = "0"; } 
            else { btn.disabled = true; msg.style.opacity = "1"; }
        }

        function goToDraw() {
            window.scrollTo(0, 0);
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
            initDeck();
        }

        function initDeck() {
            const deck = document.getElementById('shuffle-deck');
            deck.innerHTML = "";
            for(let i=0; i<12; i++) {
                const c = document.createElement('div');
                c.className = "deck-card";
                // 每個卡片賦予隨機動畫延遲，視覺更亂
                c.style.animationDelay = (Math.random() * 0.5) + "s";
                deck.appendChild(c);
            }
        }

        function stopShuffle() {
            document.getElementById('shuffle-deck').style.display = "none";
            document.getElementById('stop-shuffle-btn').style.display = "none";
            document.getElementById('draw-info').innerText = "深呼吸...請連點 2 下選取三張牌";
            document.getElementById('fan-spread').style.display = "flex";
            document.getElementById('fan-hint').style.display = "block";
            
            const fan = document.getElementById('fan-spread');
            const totalCards = 22;
            for(let i=0; i<totalCards; i++) {
                const card = document.createElement('div');
                card.className = "fan-card";
                const angle = (i - (totalCards/2)) * 6;
                card.style.transform = `rotate(${angle}deg)`;
                
                let lastClick = 0;
                card.onclick = () => {
                    const now = Date.now();
                    if(now - lastClick < 350) pickCard(card);
                    lastClick = now;
                };
                fan.appendChild(card);
            }
        }

        function pickCard(el) {
            if (pickedCards.length >= 3 || el.classList.contains('picked')) return;
            
            // 賦予選中順序的 Class 讓他移動到正確位置
            el.classList.add('picked');
            el.classList.add(`pick-${pickedCards.length}`);
            
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedCards.some(c => c.id === rid));
            const isReversed = Math.random() > 0.5;
            pickedCards.push({ id: rid, isReversed: isReversed });
            
            document.getElementById('picked-count').innerText = pickedCards.length;
            if (pickedCards.length === 3) {
                document.getElementById('draw-info').innerText = "能量已備齊，顯影中...";
                setTimeout(showFinal, 1200);
            }
        }

        function showFinal() {
            window.scrollTo(0, 0);
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            const row = document.getElementById('result-row');
            pickedCards.forEach(c => {
                const rev = c.isReversed ? "reversed-img" : "";
                const label = c.isReversed ? "[反位]" : "[正位]";
                row.innerHTML += `<div class="card-result"><img src="tarot_${c.id}.jpg" class="${rev}" onerror="this.src='https://via.placeholder.com/100x160/222/d4af37?text=Card'"><p>${label}${tarotNames[c.id]}</p></div>`;
            });
        }

        function copyResult() {
            const cardStr = pickedCards.map(c => (c.isReversed ? "[反位]" : "[正位]") + tarotNames[c.id]).join('、');
            const context = document.getElementById('custom-context').value.trim();
            let prompt = `【星辰之眼占卜委託書】\n核心領域：${selectedCategory}\n占卜提問：${selectedQuestion}\n`;
            if (context) prompt += `補充背景：${context}\n`;
            prompt += `\n【抽出牌組】：${cardStr}\n\n啟動【深度思考/多維解構模式】。請結合提問內容與牌組正逆位，運用神祕學與行為心理學深度解析，並給予具體策略指引。`;
            
            navigator.clipboard.writeText(prompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
