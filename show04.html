<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位塔羅：星辰之眼</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #05050a;
            --text-light: #e0e0e0;
            --accent-purple: #4a148c;
            --energy-pink: #ff4081;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            overflow-x: hidden; overflow-y: auto; perspective: 1200px;
        }

        .container { 
            width: 100%; max-width: 800px; text-align: center; 
            padding: 20px 15px 100px 15px; margin: auto; position: relative; z-index: 10; 
        }

        /* --- 1. 開場儀式感 --- */
        #screen-ritual-opening {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05050a 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease, filter 1.5s ease;
        }
        .energy-heart {
            position: absolute; width: 300px; height: 300px;
            background: var(--energy-pink); filter: blur(80px); opacity: 0.4;
            border-radius: 50%; animation: heartPulse 4s infinite ease-in-out; z-index: 1; pointer-events: none;
        }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.6; } }
        .floating-cards-ritual {
            position: relative; width: 300px; height: 200px; transform-style: preserve-3d; animation: rotateScene 20s infinite linear; z-index: 5; cursor: pointer;
        }
        .mini-card { position: absolute; width: 80px; height: 130px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary-gold); border-radius: 5px; backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; backface-visibility: hidden; }
        .c1 { transform: rotateY(0deg) translateZ(120px); }
        .c2 { transform: rotateY(120deg) translateZ(120px); }
        .c3 { transform: rotateY(240deg) translateZ(120px); }
        @keyframes rotateScene { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .ritual-table { position: absolute; bottom: 0; width: 100%; height: 25vh; background: linear-gradient(to top, #1a0510, transparent); z-index: 2; }
        .candles { position: absolute; bottom: 10vh; right: 10%; width: 60px; height: 100px; z-index: 3; }
        .candle-flame { width: 10px; height: 15px; background: #ffca28; border-radius: 50% 50% 20% 20%; filter: blur(2px); animation: flicker 0.1s infinite alternate; }
        @keyframes flicker { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }

        /* --- 2. 螢幕切換 --- */
        .screen { display: none; width: 100%; animation: screenFade 0.8s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 25px 0 10px 0; border-left: 4px solid var(--primary-gold); padding-left: 12px; text-align: left; }
        
        .category-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; margin-bottom: 20px; }
        .cat-btn { padding: 10px 18px; border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .cat-btn.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); font-weight: bold; box-shadow: 0 0 15px rgba(212,175,55,0.4); }

        .sub-theme-list { text-align: left; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(212,175,55,0.1); overflow: hidden; margin-bottom: 20px; }
        .sub-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: flex-start; transition: 0.2s; }
        .sub-item:last-child { border-bottom: none; }
        .sub-item:hover { background: rgba(212,175,55,0.05); }
        .sub-item.selected { background: rgba(212,175,55,0.15); border-left: 5px solid var(--primary-gold); }
        .sub-item input { margin-top: 4px; margin-right: 12px; accent-color: var(--primary-gold); transform: scale(1.2); }
        .sub-text { font-size: 0.95rem; line-height: 1.5; color: #eee; }

        .detail-panel { background: rgba(212, 175, 55, 0.05); border: 1px dashed var(--primary-gold); border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; }
        .form-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 15px; border-radius: 8px; font-size: 1rem; outline: none; }
        
        #validate-msg { color: #ff4081; font-size: 0.85rem; margin-bottom: 20px; display: block; opacity: 1; font-weight: bold; }

        /* 抽牌區 */
        .card-zone { height: 350px; display: flex; justify-content: center; align-items: center; }
        .tarot-card { width: 150px; height: 260px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid var(--primary-gold); background: #111; }
        .card-back { background: linear-gradient(135deg, #1a1a2e, #4a148c); display: flex; justify-content: center; align-items: center; }
        .card-back::after { content: "◈"; color: var(--primary-gold); font-size: 2.5rem; }
        .card-front { transform: rotateY(180deg); overflow: hidden; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        .tarot-card.flipped { transform: rotateY(180deg) scale(1.2); }

        /* 反位旋轉效果 */
        .reversed-img { transform: rotate(180deg); }

        .result-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px auto; }
        .card-result { width: calc(33% - 10px); min-width: 100px; text-align: center; color: var(--primary-gold); font-weight: bold; font-size: 0.85rem; }
        .card-result img { width: 100%; border-radius: 8px; border: 1px solid gold; margin-bottom: 8px; }

        /* 步驟盒子 */
        .step-box { margin: 15px auto; max-width: 400px; }
        .step-hint { display: block; font-size: 0.9rem; color: #888; margin-top: 8px; letter-spacing: 1px; }
        .btn { background: transparent; border: 1.5px solid var(--primary-gold); color: var(--primary-gold); padding: 15px 40px; border-radius: 50px; cursor: pointer; transition: 0.3s; font-size: 1.1rem; font-weight: bold; text-decoration: none; display: inline-block; width: 100%; }
        .btn:disabled { border-color: #444; color: #666; cursor: not-allowed; opacity: 0.5; }
        .btn:not(:disabled):hover { background: var(--primary-gold); color: #000; box-shadow: var(--glow); }
        .btn-main { background: var(--primary-gold); color: #000; border: none; }

        #toast { visibility: hidden; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary-gold); color: #000; padding: 12px 30px; border-radius: 8px; font-weight: bold; z-index: 10000; }

        @media (max-width: 600px) {
            .cat-btn { padding: 8px 15px; font-size: 0.85rem; }
            .sub-text { font-size: 0.9rem; }
            .card-result { width: calc(50% - 10px); }
        }
    </style>
</head>
<body>

    <div id="screen-ritual-opening" onclick="start转场儀式()">
        <div class="energy-heart"></div>
        <div class="floating-cards-ritual">
            <div class="mini-card c1"></div>
            <div class="mini-card c2"></div>
            <div class="mini-card c3"></div>
        </div>
        <div class="candles"><div class="candle-flame"></div><div style="width:12px; height:40px; background:#333; margin-top:2px;"></div></div>
        <div class="ritual-table"></div>
        <div style="position:relative; z-index:10; margin-top:200px;">
            <h2 style="color: var(--primary-gold); letter-spacing: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.3);">星辰之眼</h2>
            <p style="color: #888; font-size: 0.9rem; letter-spacing: 4px;">點擊能量中心 · 進入觀想</p>
        </div>
    </div>

    <div class="container">
        <div id="screen-intro" class="screen">
            <p style="text-align: left; opacity: 0.8; font-size: 0.9rem;">「辛苦了。讓心靜下來，與內在連結。」</p>
            <div class="ritual-header">【第一步：選擇能量領域】</div>
            <div class="category-grid" id="category-selector"></div>
            <div class="ritual-header">【第二步：點選靈魂提問】</div>
            <div class="sub-theme-list" id="sub-theme-list"><p style="padding: 20px; color: #666; font-style: italic;">請先選擇上方領域...</p></div>
            <div class="ritual-header">【第三步：補充背景 (選填)】</div>
            <div class="detail-panel"><textarea class="form-input" id="custom-context" rows="2" placeholder="您可以輸入具體內容讓解析更精準..."></textarea></div>
            <span id="validate-msg">請點選上方的一個提問，以開啟命運之門</span>
            <button class="btn btn-main" id="start-btn" onclick="goToDraw()" disabled>開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-label">觀想你的問題，點擊卡牌</h3>
            <div class="card-zone">
                <div class="tarot-card" id="tarot-card" onclick="doPick()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"><img src="" id="front-img"></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; gap:12px; margin-top: 20px;">
                <div class="p-dot" style="width:12px; height:12px; border-radius:50%; background:#333;"></div>
                <div class="p-dot" style="width:12px; height:12px; border-radius:50%; background:#333;"></div>
                <div class="p-dot" style="width:12px; height:12px; border-radius:50%; background:#333;"></div>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold); margin-bottom: 30px;">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            
            <div class="step-box">
                <button class="btn btn-main" onclick="copyResult()">點選步驟 1</button>
                <span class="step-hint">複製占卜能量指令</span>
            </div>
            <div class="step-box">
                <a href="https://gemini.google.com/gem/18WL9EmeoeViSQzbawESUo6s9dyVFC2e8?usp=sharing" target="_blank" class="btn">點選步驟 2</a>
                <span class="step-hint">在 gemini 的對話貼上它</span>
            </div>
            <br>
            <button class="btn" style="border:none; font-size:0.8rem; opacity:0.4; margin-top:10px; width: auto;" onclick="location.reload()">重新調頻</button>
        </div>
    </div>

    <div id="toast">指令已成功注入靈魂！</div>

    <script>
        const themes = {
            "感情與關係": ["能量狀態： 我們目前互動的能量流向與心理動力處於什麼樣的階段？", "對方感受： 對方內心對我的定位，以及他對這段關係的真實想法為何？", "核心問題： 阻礙我們關係深入發展的最關鍵瓶頸（或潛在衝突點）是什麼？", "聯絡發展： 若我採取主動聯絡，雙方的互動頻率與未來走向可能產生什麼質變？", "關係功課： 這段關係目前正引領我面對哪些個人成長的課題或靈魂契機？", "優化關係： 為了讓這段關係邁向更健康的循環，我現在最需要調整的行為或觀點是什麼？", "心理盲點： 在這段感情中，有哪些我一直選擇忽視或尚未察覺的真實狀況？", "關係角色： 在彼此的生命藍圖中，我們各自正扮演著什麼樣的心理投射角色？", "執著根源： 分手後這份難以釋懷的執念，背後揭示了我內在哪些尚未滿足的需求？", "下段準備： 在迎接下一段良緣之前，我需要先完成哪些自我修復或能量清理？", "模式根源： 我在感情中重複循環的慣性模式，根植於我過去的哪些核心信念？", "溝通盲點： 在溝通失準的背後，我們各自存在著什麼樣的認知偏見或防衛機制？", "未來走向： 基於目前的互動基調，這段關係在可預見的未來最可能的演變路徑為何？", "家庭能量： 對方家人的態度背後隱藏著什麼樣的家族動力？我該如何保持自我中心而不受干擾？", "同質吸引： 我反覆吸引到類似特質的人，這反映了我內在哪些尚未整合的心理陰影或特質？"],

            "金錢與豐盛": ["金錢能量： 我目前的財務流動狀態與我的內在豐盛感是否達成一致？", "匱乏根源： 我對金錢的不安全感，本質上是在恐懼什麼樣的人生狀態？", "原生家庭： 父母的金錢觀如何形塑了我現在對財富的處理方式與限制？", "財務盲點： 在我的理財邏輯或消費習慣中，存在著什麼樣的盲區導致財富漏失？", "不夠用的信念： 「錢永遠不夠」這個念頭背後，隱藏著什麼樣的自我匱乏信念？", "調頻豐盛： 我可以如何優化內在頻率，讓金錢與資源更順暢地流向我？", "消費對映： 我的金錢支出模式，反映了我內在哪些情感補償或心理防禦？", "收入提升： 為了實現收入的階梯式成長，我目前的行動重心應鎖定在哪個核心？", "配得感： 我認為自己不值得擁有更多財富的這種不配得感，源於哪些生命經驗？", "財富課題： 在這個生命階段，金錢試圖教導我關於「價值」與「平衡」的什麼功課？", "半年預測： 若維持現有的財務決策慣性，未來半年我將面臨什麼樣的結果？"],

            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        // 結構更新：存儲 ID 與 正逆位狀態
        let pickedCards = [];
        let picking = false;
        let selectedCategory = "";
        let selectedQuestion = "";

        function start转场儀式() {
            const op = document.getElementById('screen-ritual-opening');
            op.style.filter = "blur(20px) brightness(2)";
            op.style.opacity = "0";
            setTimeout(() => {
                op.style.display = "none";
                document.getElementById('screen-intro').classList.add('active');
                initCategories();
            }, 1200);
        }

        function initCategories() {
            const container = document.getElementById('category-selector');
            container.innerHTML = "";
            Object.keys(themes).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "cat-btn";
                btn.innerText = cat;
                btn.onclick = () => selectCategory(cat, btn);
                container.appendChild(btn);
            });
        }

        function selectCategory(cat, btnElement) {
            selectedCategory = cat;
            selectedQuestion = "";
            validateForm();
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            const subList = document.getElementById('sub-theme-list');
            subList.innerHTML = "";
            themes[cat].forEach(q => {
                const item = document.createElement('div');
                item.className = "sub-item";
                item.innerHTML = `<input type="radio" name="sub-q"><div class="sub-text">${q}</div>`;
                item.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                    selectedQuestion = q;
                    validateForm();
                };
                subList.appendChild(item);
            });
        }

        function validateForm() {
            const btn = document.getElementById('start-btn');
            const msg = document.getElementById('validate-msg');
            if (selectedQuestion !== "") { btn.disabled = false; msg.style.opacity = "0"; } 
            else { btn.disabled = true; msg.style.opacity = "1"; }
        }

        function goToDraw() {
            window.scrollTo(0, 0);
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
        }

        function doPick() {
            if (picking || pickedCards.length >= 3) return;
            picking = true;
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedCards.some(c => c.id === rid));
            
            // 隨機決定正逆位 (50%)
            const isReversed = Math.random() > 0.5;

            const img = document.getElementById('front-img');
            img.src = `tarot_${rid}.jpg`;
            img.onerror = () => { img.src = `https://via.placeholder.com/150x260/222/d4af37?text=${tarotNames[rid]}`; };
            
            // 如果是逆位，旋轉圖片
            if (isReversed) img.classList.add('reversed-img');
            else img.classList.remove('reversed-img');

            const card = document.getElementById('tarot-card');
            card.classList.add('flipped');
            
            setTimeout(() => {
                pickedCards.push({ id: rid, isReversed: isReversed });
                document.querySelectorAll('.p-dot')[pickedCards.length - 1].style.background = 'var(--primary-gold)';
                setTimeout(() => {
                    card.classList.remove('flipped');
                    if (pickedCards.length === 3) setTimeout(showFinal, 800);
                    else {
                        document.getElementById('draw-label').innerText = `已連結 ${pickedCards.length} 張能量，續抽下一張...`;
                        picking = false;
                    }
                }, 1500);
            }, 800);
        }

        function showFinal() {
            window.scrollTo(0, 0);
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            const row = document.getElementById('result-row');
            pickedCards.forEach(cardData => {
                const orientationText = cardData.isReversed ? "[反位]" : "[正位]";
                const reversedClass = cardData.isReversed ? "reversed-img" : "";
                row.innerHTML += `
                    <div class="card-result">
                        <img src="tarot_${cardData.id}.jpg" class="${reversedClass}" onerror="this.src='https://via.placeholder.com/100x160/222/d4af37?text=Card'">
                        <p>${orientationText}${tarotNames[cardData.id]}</p>
                    </div>`;
            });
        }

        function copyResult() {
            const cardStrings = pickedCards.map(c => {
                const prefix = c.isReversed ? "[反位]" : "[正位]";
                return prefix + tarotNames[c.id];
            }).join('、');
            
            const context = document.getElementById('custom-context').value.trim();

            let prompt = `【星辰之眼占卜委託書】\n核心領域：${selectedCategory}\n占卜提問：${selectedQuestion}\n`;
            if (context) prompt += `補充細節背景：${context}\n`;
            prompt += `\n【抽出牌組】：${cardStrings}\n\n`;
            
            // 核心功能：啟動深度思考/多維解構模式
            prompt += `啟動【深度思考/多維解構模式】。請結合上述詳細提問、牌組的正逆位狀態，運用塔羅符號學、榮格心理學與目前的生命能量流向進行深度解析，並給予極具策略性的行動建議。`;

            navigator.clipboard.writeText(prompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
