<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位塔羅：星辰之眼</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #05050a;
            --text-light: #e0e0e0;
            --accent-purple: #4a148c;
            --energy-pink: #ff4081;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            overflow-x: hidden; overflow-y: auto; perspective: 1500px;
        }

        .container { 
            width: 100%; max-width: 800px; text-align: center; 
            padding: 20px 15px 100px 15px; margin: auto; position: relative; z-index: 10; 
        }

        /* --- 1. 開場儀式 --- */
        #screen-ritual-opening {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05050a 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease;
        }
        .energy-heart {
            position: absolute; width: 300px; height: 300px; background: var(--energy-pink); filter: blur(80px); opacity: 0.4; border-radius: 50%; animation: heartPulse 4s infinite ease-in-out;
        }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.6; } }

        /* --- 2. 螢幕切換 --- */
        .screen { display: none; width: 100%; animation: screenFade 0.8s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 3. UI 樣式 --- */
        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 25px 0 10px 0; border-left: 4px solid var(--primary-gold); padding-left: 12px; text-align: left; }
        .category-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; margin-bottom: 20px; }
        .cat-btn { padding: 10px 18px; border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .cat-btn.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); font-weight: bold; }
        .sub-theme-list { text-align: left; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(212,175,55,0.1); overflow: hidden; margin-bottom: 20px; }
        .sub-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: flex-start; }
        .sub-item.selected { background: rgba(212,175,55,0.15); border-left: 5px solid var(--primary-gold); }
        .detail-panel { background: rgba(212, 175, 55, 0.05); border: 1px dashed var(--primary-gold); border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; }
        .form-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 15px; border-radius: 8px; font-size: 1rem; outline: none; }

        /* --- 4. 抽牌交互區 --- */
        .draw-container { position: relative; width: 100%; height: 550px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* 水平框架 */
        .card-placeholders { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 40px; height: 130px; width: 100%; }
        .placeholder-box {
            width: 80px; height: 120px; border: 1.5px dashed rgba(212,175,55,0.4);
            border-radius: 8px; background: rgba(255,255,255,0.02);
            display: flex; align-items: center; justify-content: center; color: rgba(212,175,55,0.1); font-size: 2rem;
        }

        .shuffle-zone { position: relative; height: 180px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .deck-card { 
            position: absolute; width: 80px; height: 120px; 
            background: linear-gradient(135deg, #1a1a2e, #4a148c);
            border: 1.5px solid var(--primary-gold); border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
        }

        .fan-spread { position: absolute; width: 100%; height: 300px; bottom: 0; left: 0; display: none; justify-content: center; align-items: flex-end; padding-bottom: 40px; }
        .fan-card {
            position: absolute; width: 75px; height: 115px;
            background: linear-gradient(135deg, #1a1a2e, #4a148c);
            border: 1.5px solid var(--primary-gold); border-radius: 6px;
            cursor: pointer; transform-origin: center 250px;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s;
            display: flex; justify-content: center; align-items: center; color: rgba(212,175,55,0.3);
            overflow: hidden; z-index: 10;
        }
        .fan-card img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .fan-card.picked { z-index: 1000 !important; background: #111 !important; transform-origin: center center !important; }
        .reversed-img { transform: rotate(180deg); }

        /* --- 5. 結果與步驟 --- */
        .result-row { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px auto; }
        .card-result { width: calc(33% - 15px); min-width: 100px; text-align: center; color: var(--primary-gold); font-weight: bold; }
        .card-result img { width: 100%; border-radius: 10px; border: 2px solid gold; margin-bottom: 10px; }

        .step-box { margin: 20px auto; max-width: 450px; text-align: center; }
        .step-hint { display: block; font-size: 0.9rem; color: #888; margin-top: 10px; }
        .btn { background: transparent; border: 1.5px solid var(--primary-gold); color: var(--primary-gold); padding: 16px 45px; border-radius: 50px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-main { background: var(--primary-gold); color: #000; border: none; }
        .btn:disabled { border-color: #444; color: #666; cursor: not-allowed; }

        #toast { visibility: hidden; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary-gold); color: #000; padding: 12px 30px; border-radius: 8px; font-weight: bold; z-index: 10000; }

        @media (max-width: 600px) {
            .draw-container { height: 350px; }
            .card-placeholders { height: 100px; gap: 12px; margin-bottom: 20px; }
            .placeholder-box { width: 60px; height: 95px; font-size: 1.5rem; }
            .fan-card { width: 50px; height: 80px; transform-origin: center 160px; }
            .fan-spread { height: 220px; }
            .card-result { width: calc(50% - 15px); }
        }
    </style>
</head>
<body>

    <div id="screen-ritual-opening" onclick="start转场儀式()">
        <div class="energy-heart"></div>
        <div style="position:relative; z-index:10; color:var(--primary-gold); text-align:center;">
            <h2 style="letter-spacing: 8px;">星辰之眼</h2>
            <p style="color: #888; font-size: 0.9rem; letter-spacing: 4px;">點擊能量中心 · 進入觀想</p>
        </div>

    <div class="container">

        <div id="screen-draw" class="screen">

            <div class="draw-container">

                <div id="fan-spread" class="fan-spread"></div>
            </div>
            <button class="btn btn-main" id="stop-shuffle-btn" onclick="stopShuffle()">感應結束，停止洗牌</button>
            <p id="fan-hint" style="display:none; color: #888; margin-top:10px;">✦ 連點 2 下選取三張牌 (已抽 <span id="picked-count">0</span>/3) ✦</p>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold); margin-bottom: 20px;">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            <div class="step-box"><button class="btn btn-main" onclick="copyResult()">點選步驟 1</button><span class="step-hint">複製占卜指令 (啟動深度思考)</span></div>
            <div class="step-box"><a href="https://gemini.google.com/gem/18WL9EmeoeViSQzbawESUo6s9dyVFC2e8?usp=sharing" target="_blank" class="btn">點選步驟 2</a><span class="step-hint">在 Gemini 貼上指令並送出</span></div>
            <br><button class="btn" style="border:none; font-size:0.8rem; opacity:0.4; width:auto;" onclick="location.reload()">重新調頻</button>
        </div>
    </div>

    <div id="toast">指令已成功注入靈魂！</div>

        let pickedCards = [];
        let selectedCategory = "";

        function start转场儀式() {
            document.getElementById('screen-ritual-opening').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('screen-ritual-opening').style.display = "none";
                document.getElementById('screen-intro').classList.add('active');
                initCategories();
            }, 1200);
        }

        function initCategories() {
            const container = document.getElementById('category-selector');
            container.innerHTML = "";
            Object.keys(themes).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "cat-btn";
                btn.innerText = cat;
                btn.onclick = () => {
                    selectedCategory = cat;
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderSubThemes(cat);
                };
                container.appendChild(btn);
            });
        }

        function renderSubThemes(cat) {
            const subList = document.getElementById('sub-theme-list');
            subList.innerHTML = "";
            themes[cat].forEach(q => {
                const item = document.createElement('div');
                item.className = "sub-item";
                item.innerHTML = `<div class="sub-text">${q}</div>`;
                item.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedQuestion = q;
                    document.getElementById('start-btn').disabled = false;
                };
                subList.appendChild(item);
            });
        }

        function goToDraw() {
            window.scrollTo(0, 0);
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
            initDeck();
        }

        function initDeck() {
            const deck = document.getElementById('shuffle-deck');
            deck.innerHTML = "";
            for (let i = 0; i < 15; i++) {
                const c = document.createElement('div');
                c.className = "deck-card";
                const x = Math.random() * 260 - 130;
                const y = Math.random() * 120 - 60;
                const rot = Math.random() * 720 + 360;
                c.animate([
                    { transform: `translate(0,0) rotate(0deg)`, zIndex: 1 },
                    { transform: `translate(${x}px, ${y}px) rotate(${rot}deg)`, zIndex: 10 },
                    { transform: `translate(0,0) rotate(0deg)`, zIndex: 1 }
                ], { duration: 5000, iterations: Infinity, easing: 'ease-in-out', delay: i * 150 });
                deck.appendChild(c);
            }
        }

        function stopShuffle() {
            document.getElementById('shuffle-deck').style.display = "none";
            document.getElementById('stop-shuffle-btn').style.display = "none";
            document.getElementById('draw-info').innerText = "深呼吸...請連點 2 下選取三張牌";
            document.getElementById('fan-spread').style.display = "flex";
            document.getElementById('fan-hint').style.display = "block";
            
            const fan = document.getElementById('fan-spread');
            fan.innerHTML = "";
            for(let i=0; i<22; i++) {
                const card = document.createElement('div');
                card.className = "fan-card";
                const angle = (i - 11) * 6;
                card.style.transform = `rotate(${angle}deg)`;
                let lastClick = 0;
                card.onclick = () => {
                    const now = Date.now();
                    if(now - lastClick < 350) pickCard(card);
                    lastClick = now;
                };
                fan.appendChild(card);
            }
        }

        function pickCard(el) {
            if (pickedCards.length >= 3 || el.classList.contains('picked')) return;
            
            const index = pickedCards.length;
            const targetFrame = document.getElementById(`frame-${index}`);
            
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedCards.some(c => c.id === rid));
            const isReversed = Math.random() > 0.5;
            pickedCards.push({ id: rid, isReversed: isReversed });

            const img = document.createElement('img');
            img.src = `tarot_${rid}.jpg`;
            img.style.display = "block";
            if(isReversed) img.classList.add('reversed-img');
            img.onerror = () => { img.src = `https://via.placeholder.com/80x120/111/d4af37?text=TAROT`; };
            el.appendChild(img);

            // --- 精準位移與對位修正邏輯 ---
            el.classList.add('picked');
            
            // 1. 強制讓卡牌先以中心點為準
            el.style.transformOrigin = "center center";

            // 2. 獲取物理座標
            const cardRect = el.getBoundingClientRect();
            const frameRect = targetFrame.getBoundingClientRect();
            
            // 3. 計算位移向量 (dx, dy)，確保中心點對齊
            const dx = (frameRect.left + frameRect.width / 2) - (cardRect.left + cardRect.width / 2);
            const dy = (frameRect.top + frameRect.height / 2) - (cardRect.top + cardRect.height / 2);

            // 4. 計算縮放比例，確保填滿小框框
            const scaleX = frameRect.width / el.offsetWidth;
            const scaleY = frameRect.height / el.offsetHeight;

            // 5. 執行飛入：物理位移 + 歸零旋轉 + 匹配尺寸
            el.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg) scale(${scaleX}, ${scaleY})`;
            
            targetFrame.style.borderStyle = "solid";
            targetFrame.style.borderColor = "var(--primary-gold)";
            targetFrame.innerText = "";

            document.getElementById('picked-count').innerText = pickedCards.length;
            if (pickedCards.length === 3) {
                setTimeout(showFinal, 1600);
            }
        }

        function showFinal() {
            window.scrollTo(0, 0);
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            const row = document.getElementById('result-row');
            row.innerHTML = "";
            pickedCards.forEach(c => {
                const rev = c.isReversed ? "reversed-img" : "";
                const label = c.isReversed ? "[反位]" : "[正位]";
                row.innerHTML += `<div class="card-result"><img src="tarot_${c.id}.jpg" class="${rev}" onerror="this.src='https://via.placeholder.com/100x160/111/d4af37?text=TAROT'"><p>${label}${tarotNames[c.id]}</p></div>`;
            });
        }

        function copyResult() {
            const cardStr = pickedCards.map(c => (c.isReversed ? "[反位]" : "[正位]") + tarotNames[c.id]).join('、');
            const context = document.getElementById('custom-context').value.trim();
            let prompt = `【星辰之眼占卜委託書】\n核心領域：${selectedCategory}\n占卜提問：${selectedQuestion}\n`;
            if (context) prompt += `補充背景：${context}\n`;
            prompt += `\n【抽出牌組】：${cardStr}\n\n啟動【深度思考/多維解構模式】。請結合提問內容與牌組正逆位狀態，運用神祕學與榮格心理學深度解析，並給予具備策略性的具體建議。`;
            
            navigator.clipboard.writeText(prompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
