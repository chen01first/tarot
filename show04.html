<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位塔羅：星辰之眼</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #05050a;
            --text-light: #e0e0e0;
            --accent-purple: #4a148c;
            --energy-pink: #ff4081;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; perspective: 1200px;
        }

        .container { width: 100%; max-width: 800px; text-align: center; padding: 15px; margin: auto; position: relative; z-index: 10; }

        /* --- 1. 高度優化：開場儀式感 (參考附圖) --- */
        #screen-ritual-opening {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #05050a 100%);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease, filter 1.5s ease;
        }

        /* 能量心形星雲 */
        .energy-heart {
            position: absolute; width: 300px; height: 300px;
            background: var(--energy-pink);
            filter: blur(80px); opacity: 0.4;
            border-radius: 50%;
            animation: heartPulse 4s infinite ease-in-out;
            z-index: 1; pointer-events: none;
        }
        .energy-heart::after {
            content: ""; position: absolute; width: 100%; height: 100%;
            background: var(--accent-purple); filter: blur(40px);
            top: -20px; left: 20px; border-radius: 50%;
        }

        @keyframes heartPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.4); opacity: 0.6; } }

        /* 懸浮牌陣 */
        .floating-cards-ritual {
            position: relative; width: 300px; height: 200px;
            display: flex; justify-content: center; align-items: center;
            transform-style: preserve-3d;
            animation: rotateScene 20s infinite linear;
            z-index: 5; cursor: pointer;
        }
        .mini-card {
            position: absolute; width: 80px; height: 130px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--primary-gold);
            border-radius: 5px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(212,175,55,0.3);
            display: flex; justify-content: center; align-items: center;
            backface-visibility: hidden;
        }
        .mini-card::after { content: "◈"; color: var(--primary-gold); font-size: 1.5rem; opacity: 0.5; }

        .c1 { transform: rotateY(0deg) translateZ(120px); }
        .c2 { transform: rotateY(120deg) translateZ(120px); }
        .c3 { transform: rotateY(240deg) translateZ(120px); }

        @keyframes rotateScene { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        /* 儀式桌面 */
        .ritual-table {
            position: absolute; bottom: 0; width: 100%; height: 25vh;
            background: linear-gradient(to top, #1a0510, transparent);
            z-index: 2;
        }
        
        /* 燭火感 */
        .candles {
            position: absolute; bottom: 10vh; right: 10%;
            width: 60px; height: 100px; z-index: 3;
        }
        .candle-flame {
            width: 10px; height: 15px; background: #ffca28;
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px); box-shadow: 0 0 15px #ff8f00;
            animation: flicker 0.1s infinite alternate;
        }
        @keyframes flicker { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1) translateX(1px); opacity: 1; } }

        /* --- 2. 原本結構：功能畫面 (初始隱藏) --- */
        .screen { display: none; width: 100%; animation: screenFade 0.8s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 15px 0 10px 0; border-left: 3px solid var(--primary-gold); padding-left: 10px; text-align: left;}
        .question-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; text-align: left; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(212,175,55,0.1); }
        .q-item { font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; color: #ccc; padding: 5px; }
        .q-item input { margin-right: 8px; accent-color: var(--primary-gold); }
        .detail-panel { background: rgba(212, 175, 55, 0.05); border: 1px dashed var(--primary-gold); border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 15px; }
        .form-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 8px; outline: none; }
        
        /* 抽牌與結果保持不變 */
        .card-zone { height: 350px; display: flex; justify-content: center; align-items: center; }
        .tarot-card { width: 150px; height: 260px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 2px solid var(--primary-gold); background: #111; }
        .card-back { background: linear-gradient(135deg, #1a1a2e, #4a148c); display: flex; justify-content: center; align-items: center; }
        .card-back::after { content: "◈"; color: var(--primary-gold); font-size: 2.5rem; }
        .card-front { transform: rotateY(180deg); overflow: hidden; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        .tarot-card.flipped { transform: rotateY(180deg) scale(1.3); }

        .result-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px auto; }
        .card-result { width: calc(33% - 10px); min-width: 100px; text-align: center; font-size: 0.8rem; color: var(--primary-gold); }
        .card-result img { width: 100%; border-radius: 8px; border: 1px solid gold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .btn { background: transparent; border: 1.5px solid var(--primary-gold); color: var(--primary-gold); padding: 12px 30px; border-radius: 50px; cursor: pointer; transition: 0.3s; font-size: 1rem; margin: 5px; }
        .btn:disabled { border-color: #444; color: #666; cursor: not-allowed; }
        .btn:not(:disabled):hover { background: var(--primary-gold); color: #000; box-shadow: var(--glow); }
        .btn-main { background: var(--primary-gold); color: #000; font-weight: bold; }

        #toast { visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary-gold); color: #000; padding: 10px 30px; border-radius: 8px; font-weight: bold; z-index: 999; }

        @media (max-width: 600px) {
            .question-grid { grid-template-columns: repeat(2, 1fr); }
            .card-result { width: calc(50% - 10px); }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="screen-ritual-opening" onclick="start转场儀式()">
        <div class="energy-heart"></div>
        <div class="floating-cards-ritual">
            <div class="mini-card c1"></div>
            <div class="mini-card c2"></div>
            <div class="mini-card c3"></div>
        </div>
        <div class="candles">
            <div class="candle-flame"></div>
            <div style="width:12px; height:40px; background:#333; margin-top:2px;"></div>
        </div>
        <div class="ritual-table"></div>
        <div style="position:relative; z-index:10; margin-top:200px;">
            <h2 style="color: var(--primary-gold); letter-spacing: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.3);">星辰之眼</h2>
            <p style="color: #888; font-size: 0.9rem; letter-spacing: 4px;">點擊能量中心 · 進入觀想</p>
        </div>
    </div>

    <div class="container">
        <div id="screen-intro" class="screen">
            <p style="text-align: left; opacity: 0.8; font-size: 0.9rem;">「外面的世界很吵吧？讓心靜下來，專注於當下。」</p>
            <div class="ritual-header">【選擇占卜主題】</div>
            <div class="question-grid" id="theme-selector"></div>
            <div class="ritual-header">【提供能量細節】</div>
            <div id="detail-area" class="detail-panel"></div>
            <span id="validate-msg" style="color: #ff4d4d; font-size: 0.8rem; display: block; margin-bottom: 10px; opacity: 1;">請至少填寫一項細節</span>
            <button class="btn btn-main" id="start-btn" onclick="goToDraw()" disabled>開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-label">觀想你的問題，點擊卡牌</h3>
            <div class="card-zone">
                <div class="tarot-card" id="tarot-card" onclick="doPick()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"><img src="" id="front-img"></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; gap:10px;">
                <div class="p-dot" style="width:10px; height:10px; border-radius:50%; background:#333;"></div>
                <div class="p-dot" style="width:10px; height:10px; border-radius:50%; background:#333;"></div>
                <div class="p-dot" style="width:10px; height:10px; border-radius:50%; background:#333;"></div>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold);">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            <div style="margin-bottom: 20px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                <label><input type="radio" name="mode" value="normal" checked> 一般解析</label>
                &nbsp;&nbsp;
                <label><input type="radio" name="mode" value="think"> 🧠 深度思考</label>
            </div>
            <button class="btn btn-main" onclick="copyResult()">步驟 1：複製分析指令</button>
            <a href="https://gemini.google.com/" target="_blank" class="btn">步驟 2：前往分析</a>
        </div>
    </div>

    <div id="toast">已複製指令！</div>

    <script>
        const themes = {
            "感情發展": ["目前關係階段", "對方的態度或最近一次互動", "我內心的主要不安點"],
            "復合可能": ["分手原因與經過時間", "目前的聯絡狀況", "對方目前的感情狀態"],
            "職涯發展": ["目前職業狀態", "心儀的目標", "主要的壓力來源"],
            "財運投資": ["投資類別", "對風險的承受度", "期望獲利的時間點"],
            "職場人際": ["對方的角色", "最近一次衝突點", "理想的關係發展"],
            "自我探索": ["目前的人生困惑", "靈魂課題", "想尋找的力量"],
            "其它問題": ["問題背景細節", "想知道的結果"]
        };

        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedIds = [];
        let picking = false;
        let selectedTheme = "感情發展";

        function start转场儀式() {
            const op = document.getElementById('screen-ritual-opening');
            op.style.filter = "blur(20px) brightness(2)";
            op.style.opacity = "0";
            setTimeout(() => {
                op.style.display = "none";
                document.getElementById('screen-intro').classList.add('active');
                initThemes();
            }, 1200);
        }

        function initThemes() {
            const container = document.getElementById('theme-selector');
            if(container.innerHTML !== "") return;
            Object.keys(themes).forEach((t, i) => {
                const label = document.createElement('label');
                label.className = 'q-item';
                label.innerHTML = `<input type="radio" name="theme" value="${t}" ${i===0?'checked':''}> ${t}`;
                label.onclick = () => switchTheme(t);
                container.appendChild(label);
            });
            switchTheme(selectedTheme);
        }

        function switchTheme(theme) {
            selectedTheme = theme;
            const area = document.getElementById('detail-area');
            area.innerHTML = `<span style="font-size:0.85rem; color:var(--primary-gold); display:block; margin-bottom:8px;">✦ 【${theme}】能量觀想：</span>`;
            themes[theme].forEach(q => {
                area.innerHTML += `<input type="text" class="form-input detail-input" placeholder="${q}" oninput="validateForm()">`;
            });
            validateForm();
        }

        function validateForm() {
            const inputs = document.querySelectorAll('.detail-input');
            const hasValue = Array.from(inputs).some(i => i.value.trim() !== '');
            document.getElementById('start-btn').disabled = !hasValue;
            document.getElementById('validate-msg').style.opacity = hasValue ? '0' : '1';
        }

        function goToDraw() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
        }

        function doPick() {
            if (picking || pickedIds.length >= 3) return;
            picking = true;
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedIds.includes(rid));
            const img = document.getElementById('front-img');
            img.src = `tarot_${rid}.jpg`;
            img.onerror = () => { img.src = `https://via.placeholder.com/150x260/222/d4af37?text=${tarotNames[rid]}`; };
            const card = document.getElementById('tarot-card');
            card.classList.add('flipped');
            setTimeout(() => {
                pickedIds.push(rid);
                document.querySelectorAll('.p-dot')[pickedIds.length - 1].style.background = 'var(--primary-gold)';
                setTimeout(() => {
                    card.classList.remove('flipped');
                    if (pickedIds.length === 3) setTimeout(showFinal, 800);
                    else picking = false;
                }, 1500);
            }, 800);
        }

        function showFinal() {
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            const row = document.getElementById('result-row');
            pickedIds.forEach(id => {
                row.innerHTML += `<div class="card-result"><img src="tarot_${id}.jpg" onerror="this.src='https://via.placeholder.com/100x160/222/d4af37?text=Card'"><p>${tarotNames[id]}</p></div>`;
            });
        }

        function copyResult() {
            const cards = pickedIds.map(id => tarotNames[id]).join('、');
            const inputs = document.querySelectorAll('.detail-input');
            const mode = document.querySelector('input[name="mode"]:checked').value;
            let details = [];
            inputs.forEach((input, i) => { if(input.value.trim() !== '') details.push(`${themes[selectedTheme][i]}：${input.value.trim()}`); });
            let prompt = `【星辰之眼占卜委託】\n主題：${selectedTheme}\n觀想細節：\n- ${details.join('\n- ')}\n\n【抽出牌組】：${cards}\n\n`;
            prompt += (mode === 'think') ? `請以大師視角開啟【深度思考】進行多維度深度解析。` : `請提供專業的直覺解析。`;
            navigator.clipboard.writeText(prompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }
    </script>
</body>
</html>
