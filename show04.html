<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位塔羅：開啟命運之門</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-dark: #080810;
            --text-light: #e0e0e0;
            --accent-purple: #1a0b2e;
            --glow: 0 0 20px rgba(212, 175, 55, 0.4);
            /* 優化后的實體質感 */
            --crystal-inner: #4a148c;
            --glass-shine: rgba(255, 255, 255, 0.15);
            --ao-shadow: rgba(0, 0, 0, 0.9);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-light);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; perspective: 1500px;
        }

        .container { 
            width: 100%; max-width: 800px; text-align: center; 
            padding: 15px; margin: auto;
        }

        /* --- 1. 優化：很有氣氛的星辰之眼開場儀式畫面 (覆蓋層) --- */
        #screen-ritual-opening {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 1.5s ease-in-out;
            pointer-events: all; /* 儀式層需要捕獲點擊 */
        }

        /* 實體化紫水晶桌面場景 */
        .crystal-opening-table {
            position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%) rotateX(60deg);
            width: 1000px; height: 1000px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 10px, #0d0d0d 10px, #0d0d0d 15px);
            background-color: #1a1a1a;
            background-blend-mode: overlay;
            border-radius: 50%;
            box-shadow: inset 0 0 100px #000;
            z-index: 1;
        }

        .crystal-opening-set {
            position: relative; width: 220px; height: 320px;
            display: flex; flex-direction: column; align-items: center;
            filter: drop-shadow(0 0 30px rgba(74, 20, 140, 0.4));
            z-index: 5;
            transform: translateZ(50px);
            cursor: pointer;
        }

        /* 實體紫水晶球視覺 */
        .crystal-opening-sphere {
            width: 170px; height: 170px; border-radius: 50%;
            position: relative; z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: 
                radial-gradient(circle at 30% 30%, #fff 0%, rgba(255, 255, 255, 0) 15%),
                radial-gradient(circle at center, var(--crystal-inner) 0%, #000 70%);
            box-shadow: 
                0 0 50px rgba(139, 92, 246, 0.2),
                inset -10px -10px 40px rgba(0,0,0,0.8),
                inset 10px 10px 40px rgba(255,255,255,0.05);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }
        
        .crystal-opening-sphere::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary-gold), transparent, var(--accent-purple), transparent);
            opacity: 0.15; animation: opening-swirl 12s infinite linear; filter: blur(25px);
        }
        
        .crystal-opening-sphere::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 5px; height: 5px; background: white; border-radius: 50%;
            box-shadow: 0 0 20px 8px white; animation: opening-pulse 2.5s infinite;
        }

        /* 古典底座視覺 (契合 1 號球底座) */
        .crystal-opening-base {
            position: relative; width: 150px; height: 70px; margin-top: -30px; z-index: 4;
            clip-path: polygon(12% 0%, 88% 0%, 100% 100%, 0% 100%);
            background: linear-gradient(to right, #1a1a1a, #4d3d1a, #b89b5e, #4d3d1a, #1a1a1a);
            border-radius: 6px 6px 18px 18px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.9);
        }

        @keyframes opening-swirl { to { transform: rotate(360deg); } }
        @keyframes opening-pulse { 0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.8); } }

        /* --- 其它原本呼吸動畫、畫面切換佈局保持不變 --- */
        .breath-wrapper {
            position: relative; width: 100px; height: 100px; margin: 15px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .breath-circle {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
            border: 1px solid var(--primary-gold); border-radius: 50%;
            animation: breathCycle 8s infinite ease-in-out;
        }
        .breath-text { position: relative; z-index: 2; color: var(--primary-gold); font-size: 0.75rem; font-weight: bold; }

        @keyframes breathCycle {
            0%, 100% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 0.8; box-shadow: 0 0 30px var(--primary-gold); }
        }

        /* --- 原本的主畫面切換佈局 --- */
        .screen { display: none; width: 100%; animation: screenFade 0.6s forwards; }
        .screen.active { display: block; }
        @keyframes screenFade { from { opacity: 0; } to { opacity: 1; } }

        /* --- 原本的主題與細節佈局 --- */
        .ritual-header { color: var(--primary-gold); font-size: 1.1rem; font-weight: bold; margin: 15px 0 10px 0; border-left: 3px solid var(--primary-gold); padding-left: 10px; text-align: left;}
        
        .question-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px; text-align: left; background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(212,175,55,0.1);
        }
        .q-item { font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; color: #ccc; padding: 5px; transition: 0.3s; }
        .q-item input { margin-right: 8px; accent-color: var(--primary-gold); }

        .detail-panel {
            background: rgba(212, 175, 55, 0.05); border: 1px dashed var(--primary-gold);
            border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 20px;
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .detail-title { font-size: 0.85rem; color: var(--primary-gold); margin-bottom: 10px; display: block; font-weight: bold; }
        .form-group { margin-bottom: 10px; }
        .form-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #444;
            color: white; padding: 12px; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        .form-input:focus { border-color: var(--primary-gold); background: rgba(255,255,255,0.05); }

        #validate-msg { color: #ff4d4d; font-size: 0.8rem; margin-bottom: 10px; display: block; height: 1.2rem; }

        /* --- 原本的抽牌視覺與結果區 (RWD 優化) --- */
        .card-zone { height: 350px; width: 100%; display: flex; justify-content: center; align-items: center; overflow: visible; }
        .tarot-card {
            width: 150px; height: 260px; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 12px; border: 2px solid var(--primary-gold); background: #111;
        }
        .card-back { background: linear-gradient(135deg, #1a1a2e, #4a148c); display: flex; justify-content: center; align-items: center; }
        .card-back::after { content: "◈"; color: var(--primary-gold); font-size: 2.5rem; }
        .card-front { transform: rotateY(180deg); overflow: hidden; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }
        .tarot-card.flipped { transform: rotateY(180deg) scale(1.3) translateZ(50px); }

        /* --- 原本的結果顯示區 --- */
        .result-row { 
            display: flex; justify-content: center; align-items: flex-start;
            gap: 12px; flex-wrap: wrap; margin: 20px auto; width: 100%;
        }
        .card-result { 
            width: calc(33% - 10px); min-width: 100px; max-width: 140px;
            text-align: center; font-size: 0.8rem; color: var(--primary-gold); 
        }
        .card-result img { width: 100%; border-radius: 8px; border: 1px solid gold; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* --- 按鈕與通用樣式 --- */
        .btn {
            background: transparent; border: 1.5px solid var(--primary-gold);
            color: var(--primary-gold); padding: 12px 30px; border-radius: 50px;
            cursor: pointer; transition: 0.3s; font-size: 1rem; margin: 5px;
            text-decoration: none; display: inline-block; max-width: 100%;
        }
        .btn:disabled { border-color: #444; color: #666; cursor: not-allowed; opacity: 0.5; }
        .btn:not(:disabled):hover { background: var(--primary-gold); color: #000; box-shadow: var(--glow); }
        .btn-main { background: var(--primary-gold); color: #000; font-weight: bold; }

        #toast {
            visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--primary-gold); color: #000; padding: 10px 30px; border-radius: 8px; font-weight: bold; z-index: 999;
        }

        @media (max-width: 600px) {
            .question-grid { grid-template-columns: repeat(2, 1fr); }
            .tarot-card.flipped { transform: rotateY(180deg) scale(1.15) translateZ(30px); }
            .card-result { width: calc(50% - 10px); }
            .btn { width: 100%; padding: 12px 10px; }
        }
    </style>
</head>
<body>

    <div id="screen-ritual-opening" onclick="start转场儀式()">
        <div class="crystal-opening-table"></div>
        
        <h2 style="color: var(--primary-gold); letter-spacing: 5px; margin-bottom: 30px; text-shadow: 0 0 15px rgba(212,175,55,0.4);">開啟命運之門</h2>
        
        <div class="crystal-opening-set">
            <div class="crystal-opening-sphere"></div>
            <div class="crystal-opening-base"></div>
        </div>
        
        <p style="color: #666; font-size: 0.9rem; margin-top: 40px; letter-spacing: 3px; font-style: italic;">靜心，觸碰紫晶...</p>
    </div>

    <div class="container">
        <div id="screen-intro" class="screen">
            <p style="text-align: left; opacity: 0.8; font-size: 0.9rem;">「辛苦了。外面的世界很吵吧？讓心靜下來。」</p>
            
            <div class="ritual-header">【選擇占卜主題】</div>
            <div class="question-grid" id="theme-selector"></div>

            <div class="ritual-header">【提供能量細節】</div>
            <div id="detail-area" class="detail-panel"></div>

            <span id="validate-msg">請至少填寫一項細節，以開啟命運之門</span>

            <div class="breath-wrapper">
                <div class="breath-circle"></div>
                <div class="breath-text" id="b-text">吸氣...</div>
            </div>

            <button class="btn btn-main" id="start-btn" onclick="goToDraw()" disabled>開啟命運之門</button>
        </div>

        <div id="screen-draw" class="screen">
            <h3 id="draw-label">觀想你的問題，點擊卡牌</h3>
            <div class="card-zone">
                <div class="tarot-card" id="tarot-card" onclick="doPick()">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front"><img src="" id="front-img"></div>
                </div>
            </div>
            <div id="progress-dots" style="display:flex; justify-content:center; gap:10px;">
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
                <div style="width:10px; height:10px; border-radius:50%; background:#333;" class="p-dot"></div>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 style="color: var(--primary-gold);">命運的倒影</h2>
            <div class="result-row" id="result-row"></div>
            
            <div class="mode-box" style="margin-bottom: 20px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px;">
                <label><input type="radio" name="mode" value="normal" checked> 一般解析</label>
                &nbsp;&nbsp;
                <label><input type="radio" name="mode" value="think"> 🧠 深度思考</label>
            </div>

            <button class="btn btn-main" onclick="copyResult()">步驟 1：複製分析指令</button>
            <p style="font-size: 0.8rem; opacity: 0.7; margin: 15px 0; color: var(--primary-gold);">✦ 點擊「前往分析」後貼上並送出 ✦</p>
            <a href="https://gemini.google.com/gem/18WL9EmeoeViSQzbawESUo6s9dyVFC2e8?usp=sharing" target="_blank" class="btn">步驟 2：前往分析網頁</a>
            <br>
            <button class="btn" style="border:none; font-size:0.8rem; opacity:0.4; margin-top:20px;" onclick="location.reload()">重新調頻</button>
        </div>
    </div>

    <div id="toast">已複製指令！</div>

    <script>
        // --- 完整原本的主題與細節資料保持不變 ---
        const themes = {
            "感情發展": ["目前關係階段 (如：曖昧、交往中)", "對方的態度或最近一次互動", "我內心的主要不安點"],
            "復合可能": ["分手原因與經過時間", "目前的聯絡狀況 (如：斷聯、點讚)", "對方目前的感情狀態 (若知曉)"],
            "職涯發展": ["目前職業狀態 (如：待業、在職)", "心儀的目標 (如：某公司、升遷)", "主要的壓力來源或阻礙"],
            "正緣桃花": ["過去的感情痛點", "理想伴侶的特質", "目前的社交活躍程度"],
            "財運投資": ["投資類別 (如：股票、副業)", "對風險的承受度", "期望獲利的時間點"],
            "職場人際": ["對方的角色 (如：小人、主管)", "最近一次衝突點", "我希望達成的理想關係"],
            "身心健康": ["目前的情緒狀態 (如：焦慮、低落)", "特定的身體不適或壓力感", "近期的睡眠或能量品質"],
            "自我探索": ["目前的人生困惑", "靈魂課題或反覆出現的行為", "想尋找的內在力量"],
            "二選一決策": ["路徑 A 的預期 (如：留任)", "路徑 B 的預期 (如：跳槽)", "猶豫不決的核心原因"],
            "其它問題": ["請詳述您的問題背景", "相關的人事物細節", "您最想知道的結果"]
        };

        const tarotNames = {
            "00": "00-愚者", "01": "01-魔術師", "02": "02-女祭司", "03": "03-皇后", "04": "04-皇帝", "05": "05-教皇", "06": "06-戀人", "07": "07-戰車", "08": "08-力量", "09": "09-隱者", "10": "10-命運之輪", "11": "11-正義", "12": "12-倒吊人", "13": "13-死神", "14": "14-節制", "15": "15-惡魔", "16": "16-塔", "17": "17-星星", "18": "18-月亮", "19": "19-太陽", "20": "20-審判", "21": "21-世界",
            "22": "22-權杖王牌", "23": "23-權杖二", "24": "24-權杖三", "25": "25-權杖四", "26": "26-權杖五", "27": "27-權杖六", "28": "28-權杖七", "29": "29-權杖八", "30": "30-權杖九", "31": "31-權杖十", "32": "32-權杖侍者", "33": "33-權杖騎士", "34": "34-權杖王后", "35": "35-權杖國王",
            "36": "36-聖杯王牌", "37": "37-聖杯二", "38": "38-聖杯三", "39": "39-聖杯四", "40": "40-聖杯五", "41": "41-聖杯六", "42": "42-聖杯七", "43": "43-聖杯八", "44": "44-聖杯九", "45": "45-聖杯十", "46": "46-聖杯侍者", "47": "47-聖杯騎士", "48": "48-聖杯王后", "49": "49-聖杯國王",
            "50": "50-寶劍王牌", "51": "51-寶劍二", "52": "52-寶劍三", "53": "53-寶劍四", "54": "54-寶劍五", "55": "55-寶劍六", "56": "56-寶劍七", "57": "57-寶劍八", "58": "58-寶劍九", "59": "59-寶劍十", "60": "60-寶劍侍者", "61": "61-寶劍騎士", "62": "62-寶劍王后", "63": "63-寶劍國王",
            "64": "64-錢幣王牌", "65": "65-錢幣二", "66": "66-錢幣三", "67": "67-錢幣四", "68": "68-錢幣五", "69": "69-錢幣六", "70": "70-錢幣七", "71": "71-錢幣八", "72": "72-錢幣九", "73": "73-錢幣十", "74": "74-錢幣侍者", "75": "75-錢幣騎士", "76": "76-錢幣王后", "77": "77-錢幣國王"
        };

        let pickedIds = [];
        let picking = false;
        let selectedTheme = "感情發展";

        // --- 優化：處理有氣氛的開場轉場 ---
        function start转场儀式() {
            // 點擊球體，轉場層淡出
            const openingScreen = document.getElementById('screen-ritual-opening');
            openingScreen.style.opacity = '0';
            openingScreen.style.pointerEvents = 'none'; // 轉場層淡出期間不接收點擊

            // 確保原本的主畫面層此時是啟動的
            document.getElementById('screen-intro').classList.add('active');

            // 初始化原本的主題呼吸動畫等邏輯
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(50);
            
            // 延遲一段時間后彻底移除儀式層 (與淡出時間匹配)
            setTimeout(() => {
                openingScreen.style.display = 'none';
            }, 1500);
        }

        // --- 其它原本邏輯保持不變 ---
        function initThemes() {
            const container = document.getElementById('theme-selector');
            Object.keys(themes).forEach((t, index) => {
                const label = document.createElement('label');
                label.className = 'q-item';
                label.innerHTML = `<input type="radio" name="theme" value="${t}" ${index===0?'checked':''}> ${t}`;
                label.onclick = () => switchTheme(t);
                container.appendChild(label);
            });
            switchTheme(selectedTheme);
        }

        function switchTheme(theme) {
            selectedTheme = theme;
            const area = document.getElementById('detail-area');
            area.innerHTML = `<span class="detail-title">【${theme}】導引觀想：</span>`;
            themes[theme].forEach((q, i) => {
                area.innerHTML += `
                    <div class="form-group">
                        <input type="text" class="form-input detail-input" placeholder="${q}" oninput="validateForm()">
                    </div>
                `;
            });
            validateForm();
        }

        function validateForm() {
            const inputs = document.querySelectorAll('.detail-input');
            const btn = document.getElementById('start-btn');
            const msg = document.getElementById('validate-msg');
            let hasValue = false;
            inputs.forEach(i => { if(i.value.trim() !== '') hasValue = true; });
            btn.disabled = !hasValue;
            msg.style.opacity = hasValue ? '0' : '1';
        }

        // 呼吸動畫邏輯移至 screen-intro 頁面生命週期
        setInterval(() => {
            const bt = document.getElementById('b-text');
            if (bt && document.getElementById('screen-intro').classList.contains('active')) {
                bt.innerText = bt.innerText === "吸氣..." ? "吐氣..." : "吸氣...";
            }
        }, 4000);

        function goToDraw() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-draw').classList.add('active');
        }

        function doPick() {
            if (picking || pickedIds.length >= 3) return;
            picking = true;
            let rid;
            do { rid = Math.floor(Math.random() * 78).toString().padStart(2, '0'); } while (pickedIds.includes(rid));
            
            const img = document.getElementById('front-img');
            img.src = `tarot_${rid}.jpg`;
            img.onerror = () => { img.src = `https://via.placeholder.com/150x260/222/d4af37?text=${tarotNames[rid]}`; };
            
            const card = document.getElementById('tarot-card');
            card.classList.add('flipped');
            
            setTimeout(() => {
                pickedIds.push(rid);
                const dots = document.querySelectorAll('.p-dot');
                dots[pickedIds.length - 1].style.background = 'var(--primary-gold)';
                
                setTimeout(() => {
                    card.classList.remove('flipped');
                    if (pickedIds.length === 3) {
                        setTimeout(showFinal, 800);
                    } else {
                        document.getElementById('draw-label').innerText = `已連結 ${pickedIds.length} 張能量，續抽下一張...`;
                        picking = false;
                    }
                }, 1500);
            }, 800);
        }

        function showFinal() {
            document.getElementById('screen-draw').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            const row = document.getElementById('result-row');
            row.innerHTML = '';
            pickedIds.forEach(id => {
                row.innerHTML += `<div class="card-result"><img src="tarot_${id}.jpg" onerror="this.src='https://via.placeholder.com/100x160/222/d4af37?text=Card'"><p>${tarotNames[id]}</p></div>`;
            });
        }

        function copyResult() {
            const cards = pickedIds.map(id => tarotNames[id]).join('、');
            const inputs = document.querySelectorAll('.detail-input');
            const mode = document.querySelector('input[name="mode"]:checked').value;
            let details = [];
            inputs.forEach((input, index) => {
                if(input.value.trim() !== '') {
                    details.push(`${themes[selectedTheme][index]}：${input.value.trim()}`);
                }
            });

            let prompt = `【塔羅占卜委託書】\n核心主題：${selectedTheme}\n問題背景細節：\n- ${details.join('\n- ')}\n\n【抽出牌組】：${cards}\n\n`;
            
            if (mode === 'think') {
                prompt += `請啟動【深度思考/推理模式】。請結合上述詳細背景，運用塔羅符號學與行為心理學進行分析，提供具備策略性的具體建議。`;
            } else {
                prompt += `請根據以上背景提供專業的塔羅解析與溫馨建議。`;
            }

            navigator.clipboard.writeText(prompt).then(() => {
                const t = document.getElementById('toast');
                t.style.visibility = 'visible';
                setTimeout(() => t.style.visibility = 'hidden', 3000);
            });
        }

        // 開場初始化開場畫面
        window.onload = function() {
            initThemes();
            // 原本 initThemes 會立刻將screen-intro 設為active，我們移至點擊開場球後
            document.getElementById('screen-ritual-opening').style.opacity = '1';
        };
    </script>
</body>
</html>
